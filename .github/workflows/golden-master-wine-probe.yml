name: Golden Master Wine Probe

on:
  push:
    paths:
      - ".github/workflows/golden-master-wine-probe.yml"
      - "tools/live_ball_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wine and X11 automation
        shell: bash
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb xdotool x11-utils imagemagick unzip

      - name: Fetch verified v1.014 package
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json
          cat /tmp/ingest.json

      - name: Boot original Windows executable under Xvfb/Wine
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export WINEPREFIX="$RUNNER_TEMP/wineprefix"
          export WINEDEBUG=-all
          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          GAME_DIR="$(dirname "$WIN_EXE")"
          cd "$GAME_DIR"
          wineboot -u >/tmp/wineboot.log 2>&1 || true
          wine ./GOLFWIN.EXE >/tmp/golfwin.stdout 2>/tmp/golfwin.stderr &
          echo $! >/tmp/wine_launcher_pid
          sleep 10

          echo "=== processes ==="
          ps auxww | grep -E 'wine|GOLFWIN|golfwin' | grep -v grep || true
          echo "=== windows ==="
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null || true
          echo "=== xwininfo ==="
          xwininfo -root -tree || true

          import -window root "$GITHUB_WORKSPACE/analysis/private/wine-root.png" || true

          # Find the Linux process whose mapped executable contains GOLFWIN.EXE.
          python - <<'PY'
          from pathlib import Path
          import os,re,time
          matches=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  maps=(p/'maps').read_text(errors='ignore')
                  cmd=(p/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='ignore')
              except Exception:
                  continue
              if 'GOLFWIN.EXE' in maps.upper() or 'GOLFWIN.EXE' in cmd.upper():
                  matches.append((int(p.name),cmd,maps[:1000]))
          print(matches)
          if not matches:
              raise SystemExit('no live GOLFWIN process found')
          Path('/tmp/golf_pid').write_text(str(matches[0][0]))
          PY

          PID="$(cat /tmp/golf_pid)"
          python "$GITHUB_WORKSPACE/tools/live_ball_probe.py" "$PID"             --duration-s 2 --interval-ms 20             -o "$GITHUB_WORKSPACE/analysis/private/wine-ball-probe.json"

      - name: Print probe summary
        if: always()
        shell: bash
        run: |
          echo "=== stdout ==="; cat /tmp/golfwin.stdout 2>/dev/null || true
          echo "=== stderr ==="; cat /tmp/golfwin.stderr 2>/dev/null || true
          echo "=== ball probe ==="
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('analysis/private/wine-ball-probe.json')
          if p.exists():
              j=json.loads(p.read_text())
              print('samples',len(j['samples']))
              for row in j['samples'][:10]: print(row)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-golden-master-wine-probe
          path: |
            analysis/private/wine-root.png
            analysis/private/wine-ball-probe.json
            /tmp/golfwin.stdout
            /tmp/golfwin.stderr
            /tmp/xvfb.log
            /tmp/wineboot.log
          if-no-files-found: ignore
          retention-days: 7
