name: Green Slope And Cup Analysis

on:
  push:
    paths:
      - ".github/workflows/green-slope-cup-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace green, slope and cup branches
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          out="analysis/private/green-cup"
          mkdir -p "$out"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40a560 --end-va 0x40aaa0 \
            -o "$out/ball-update-green-cup.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40b900 --end-va 0x40ba20 \
            -o "$out/slope-and-distance.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41ee7a --va 0x41ef66 --va 0x41f0c5 --va 0x41f0c9 \
            --va 0x41f3b2 --va 0x41f3b4 --radius 48 \
            -o "$out/state-xrefs.json"

          echo "analysis artifacts generated"
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-green-slope-cup-analysis
          path: analysis/private/green-cup/
          retention-days: 14
