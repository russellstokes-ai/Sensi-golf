name: Gate 2 Course Resource Validation

on:
  push:
    paths:
      - ".github/workflows/gate2-course-resource-validation.yml"
      - "engine/include/sensigolf/classic_course_resources.hpp"
      - "engine/src/classic_course_resources.cpp"
      - "engine/tests/classic_course_resources_tests.cpp"
      - "engine/tools/classic_course_probe.cpp"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Build course resource layer
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure

      - name: Validate real original course bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="analysis/private/step2/extracted/epf"
          test "$(stat -c%s "$ROOT/MAPM01.MAP")" -eq 7848
          test "$(stat -c%s "$ROOT/MAPM01.SPT")" -eq 50
          test "$(stat -c%s "$ROOT/MAPI01.RAW")" -eq 5120
          test "$(stat -c%s "$ROOT/MAPI02.RAW")" -eq 5120

          ./build/engine/sensigolf_classic_course_probe \
            "$ROOT/MAPM01.MAP" "$ROOT/MAPM01.SPT" \
            "$ROOT/MAPI01.RAW" "$ROOT/MAPI02.RAW" \
            | tee /tmp/course-probe.json

          python - <<'PY'
          import json
          j=json.load(open('/tmp/course-probe.json'))
          assert j['width'] > 0 and j['height'] > 0, j
          assert j['mapi_tiles'] == 640, j
          assert j['spt_records'] == 5, j
          print('real-course resource validation passed:',j)
          PY
