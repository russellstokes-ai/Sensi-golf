name: Gate 2 Discover Remaining Original Round

on:
  push:
    paths:
      - ".github/workflows/gate2-discover-original-round.yml"
      - "tools/original_round_discovery_audit.py"
      - "engine/tools/classic_real_hole_solver_probe.cpp"
      - "engine/tools/classic_real_round_fixture_probe.cpp"
      - "engine/tests/fixtures/original_round_first_eight.txt"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original executable emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Acquire and validate exact Windows v1.014 assets
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fLSs --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip; then
            curl -fLSs --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://archive.org/download/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
              -o /tmp/Sensible_Golf_PC.zip
          fi
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Build core and full original-physics replay tools
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure
      - name: Discover and continuously replay following real-original holes
        shell: bash
        run: |
          set -euo pipefail
          OUT="analysis/private/round-discovery"
          ROOT="analysis/private/step2/extracted/epf"
          mkdir -p "$OUT"
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          python tools/original_v1014_next_hole_resources.py "$WIN_EXE" \
            -o "$OUT/original-metadata.json"
          python tools/original_round_discovery_audit.py \
            --original-metadata "$OUT/original-metadata.json" \
            --original-root "$ROOT" \
            --prefix-fixture "engine/tests/fixtures/original_round_first_eight.txt" \
            --solver "$(pwd)/build/engine/sensigolf_real_hole_solver_probe" \
            --replay "$(pwd)/build/engine/sensigolf_real_round_fixture_probe" \
            --output "$OUT" --max-new 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v1014-bounded-round-discovery
          path: analysis/private/round-discovery/
          retention-days: 30
