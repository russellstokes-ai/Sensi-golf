name: Gate 2 Hole Completion Semantic Check

on:
  push:
    paths:
      - ".github/workflows/gate2-hole-completion-semantic-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace actual completion entries and near-cup logic
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-hole-semantic
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE"             --start-va 0x40A430 --end-va 0x40A5B0             -o "$OUT/near-hole-preupdate.json"

          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x40CD00 --va 0x40CD25 --va 0x40CD4A --va 0x40CE09             --radius 72 -o "$OUT/completion-entry-xrefs.json"

          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x41F883 --va 0x420FEE --va 0x420FEF             --radius 48 -o "$OUT/completion-state-xrefs.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-hole-semantic/near-hole-preupdate.json'))
          print('=== near-hole ===')
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          j=json.load(open('analysis/private/gate2-hole-semantic/completion-entry-xrefs.json'))
          print('=== completion xrefs ===')
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-hole-completion-semantic-check
          path: analysis/private/gate2-hole-semantic/
          retention-days: 30
