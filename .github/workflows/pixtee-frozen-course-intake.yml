name: Pixtee Frozen Course/Menu Intake Contract
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/pixtee_frozen_course_intake.py'
      - 'pixtee-godot/native/src/pixtee_three_hole_round*'
      - 'pixtee-godot/native/tests/three_hole_preview_gate_tests.cpp'
      - 'pixtee-godot/native/tests/lakewood_native_boundary_release_gate.cpp'
      - 'tools/tests/test_pixtee_frozen_course_intake.py'
      - '.github/workflows/pixtee-frozen-course-intake.yml'
      - 'spec/pixtee/PIXTEE_COURSE_AND_MENU_INTAKE_CONTRACT_2026-10-12.md'
  push:
    branches: [feat/pixtee-m1-course-intake-safe]
    paths:
      - 'tools/pixtee_frozen_course_intake.py'
      - 'tools/tests/test_pixtee_frozen_course_intake.py'
      - '.github/workflows/pixtee-frozen-course-intake.yml'
      - 'spec/pixtee/PIXTEE_COURSE_AND_MENU_INTAKE_CONTRACT_2026-10-12.md'
permissions:
  contents: read
jobs:
  safe-readonly-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit test immutable source path, hash, ZIP and menu scanning
        run: python3 -m unittest discover -s tools/tests -p 'test_pixtee_frozen_course_intake.py' -v
      - name: Check original canonical research bank integrity
        run: python3 pixtee-godot/tools/verify_reference_data.py
      - name: Audit milestone-one source register and 14 commercial gates
        run: python3 tools/verify_pixtee_milestone_one_inventory.py
  lakewood-native-world-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile preserved recovered C++ engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j 2
      - name: Verify native 544x912 Lakewood boundary, real-shot OOB/water and event recovery
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iengine/include \
            pixtee-godot/native/tests/lakewood_native_boundary_release_gate.cpp \
            build/engine/libsensigolf_core.a -o build/lakewood-boundary-gate
          build/lakewood-boundary-gate
  native-three-hole-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile recovered native engine and run original baseline tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
      - name: Run three-hole preview product gate against actual original-native cup events
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iengine/include -Ipixtee-godot/native/src \
            pixtee-godot/native/src/pixtee_round_runtime.cpp \
            pixtee-godot/native/src/recovered_welly_tick.cpp \
            pixtee-godot/native/src/pixtee_three_hole_round.cpp \
            pixtee-godot/native/tests/three_hole_preview_gate_tests.cpp \
            build/engine/libsensigolf_core.a \
            -o build/pixtee-three-hole-gate
          build/pixtee-three-hole-gate
