name: Gate 1 Tree Terminal Helpers

on:
  push:
    paths:
      - ".github/workflows/gate1-tree-terminal-helpers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace terminal and classification helpers
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT="analysis/private/gate1-tree-terminal"
          mkdir -p "$OUT"

          for spec in             "40b930 40b9ec helper-40b935"             "40b950 40b998 helper-40b965"             "40ab80 40ac32 helper-40ab97"             "40a200 40a250 helper-40a22b"             "40ccd0 40cd80 terminal-40cd00"             "40c600 40c700 helper-40c630"
          do
            set -- $spec
            python tools/pe_disasm_range.py "$WIN_EXE"               --start-va "0x$1" --end-va "0x$2" -o "$OUT/$3.json"
          done

          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x40B965 --va 0x40AB97 --va 0x40A22B             --va 0x40CD00 --va 0x40CD25 --va 0x40CD4A --va 0x40C630             --radius 36 -o "$OUT/xrefs.json"

          python - <<'PY'
          import glob,json,os
          for p in sorted(glob.glob('analysis/private/gate1-tree-terminal/*.json')):
              j=json.load(open(p))
              print('\n====',os.path.basename(p),'====')
              if 'instructions' in j:
                  for i in j['instructions']:
                      print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
              if 'xrefs' in j:
                  for x in j['xrefs']:
                      print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
                      for i in x['instructions']:
                          print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-tree-terminal
          path: analysis/private/gate1-tree-terminal/
          retention-days: 14
