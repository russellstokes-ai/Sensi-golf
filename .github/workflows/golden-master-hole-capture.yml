name: Golden Master Hole Capture

on:
  push:
    paths:
      - ".github/workflows/golden-master-hole-capture.yml"
      - "engine/**"
      - "tools/original_v1014_flat_oracle.py"
      - "tools/original_v1014_oracle.py"
      - "tools/compare_full_oracle.py"
      - "tools/pe_target_xrefs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hole-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn

      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Build portable core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Locate original executable
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          test -n "$WIN_EXE"
          echo "WIN_EXE=$WIN_EXE" >> "$GITHUB_ENV"

      - name: Zero-tolerance code-8 terminal parity
        shell: bash
        run: |
          set -euo pipefail
          out="analysis/private/golden-master-hole"
          mkdir -p "$out"

          python tools/original_v1014_flat_oracle.py "$WIN_EXE" \
            --club 5 --lie 9 --power 83 --accuracy 63 \
            --direction 777 --max-ticks 512 --terrain-index 7 \
            -o "$out/hole-original.json"

          ./build/engine/sensigolf_recovered_full_probe \
            5 9 83 63 777 512 8 \
            > "$out/hole-recovered.json"

          python tools/compare_full_oracle.py \
            "$out/hole-original.json" "$out/hole-recovered.json" \
            -o "$out/hole-comparison.json"

          cat "$out/hole-comparison.json"

      - name: Unit/core tests
        run: |
          python -m unittest discover -s tests -v
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-golden-master-hole-capture
          path: analysis/private/golden-master-hole/
          retention-days: 14
