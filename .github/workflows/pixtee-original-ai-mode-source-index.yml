name: Pixtee Original AI and Tournament Code Recovery Index
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - '.github/workflows/pixtee-original-ai-mode-source-index.yml'
      - 'tools/locate_original_game_modes_ai.py'
permissions:
  contents: read
jobs:
  original-ai-binary-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch original SHA-verified Windows executable
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Identify source game AI/turn/tournament branches from original binary
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/locate_original_game_modes_ai.py \
            --exe "$EXE" -o analysis/private/original-ai-game-mode-code-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-original-ai-and-mode-callsite-index
          path: analysis/private/original-ai-game-mode-code-index.json
          retention-days: 30
