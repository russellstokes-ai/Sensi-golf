name: Gate 2 Hazard Recovery Parity

on:
  push:
    paths:
      - ".github/workflows/gate2-hazard-recovery-parity.yml"
      - "tools/original_v1014_hazard_recovery_oracle.py"
      - "engine/include/sensigolf/recovered_hazard_recovery.hpp"
      - "engine/src/recovered_hazard_recovery.cpp"
      - "engine/tests/recovered_hazard_recovery_tests.cpp"
      - "engine/tools/recovered_hazard_recovery_probe.cpp"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Build recovered hazard recovery primitive
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Compare original recovery state at zero tolerance
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-hazard-recovery-parity
          mkdir -p "$OUT"

          compare_case() {
            name="$1"; bx="$2"; by="$3"; sx="$4"; sy="$5"; xe="$6"; ye="$7"; gm="$8"
            python tools/original_v1014_hazard_recovery_oracle.py "$WIN_EXE"               --ball-x "$bx" --ball-y "$by" --safe-x "$sx" --safe-y "$sy"               --x-extent "$xe" --y-extent "$ye" --green-mode "$gm"               -o "$OUT/$name-original.json"

            ./build/engine/sensigolf_recovered_hazard_recovery_probe               "$bx" "$by" "$sx" "$sy" "$xe" "$ye" "$gm"               > "$OUT/$name-recovered.json"

            python - "$OUT/$name-original.json" "$OUT/$name-recovered.json" "$OUT/$name-comparison.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          b=json.load(open(sys.argv[2]))
          fields=("ball_x","ball_y","player_x","player_y",
                  "player_last_x","player_last_y","height","pause","player_flags")
          mismatches={f:(a.get(f),b.get(f)) for f in fields if int(a.get(f))!=int(b.get(f))}
          report={"pass":not mismatches,"tolerance":0,"fields":list(fields),"mismatches":mismatches}
          open(sys.argv[3],"w").write(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          assert report["pass"],report
          PY
          }

          # In-bounds stopped ball stays in place; player anchor becomes ball-15.
          compare_case in_bounds $((50<<16)) $((60<<16)) $((85<<16)) $((95<<16)) 100 100 0

          # Out-of-bounds ball restores from saved safe anchor, then +15 ball offset.
          compare_case out_of_bounds $((500<<16)) $((600<<16)) $((85<<16)) $((95<<16)) 100 100 0

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-hazard-recovery-parity
          path: analysis/private/gate2-hazard-recovery-parity/
          retention-days: 30
