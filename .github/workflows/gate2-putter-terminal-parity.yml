name: Gate 2 Putter Terminal Parity

on:
  push:
    paths:
      - ".github/workflows/gate2-putter-terminal-parity.yml"
      - "tools/original_v1014_putter_terminal_oracle.py"
      - "engine/include/sensigolf/recovered_putter_terminal.hpp"
      - "engine/src/recovered_putter_terminal.cpp"
      - "engine/tests/recovered_putter_terminal_tests.cpp"
      - "engine/tools/recovered_putter_terminal_probe.cpp"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Build recovered terminal primitive
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Compare code 8 9 10 terminal state at zero tolerance
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-putter-terminal-parity
          mkdir -p "$OUT"

          run_case() {
            name="$1"; terrain="$2"; code="$3"
            python tools/original_v1014_putter_terminal_oracle.py "$WIN_EXE"               --terrain-index "$terrain" -o "$OUT/$name-original.json"
            ./build/engine/sensigolf_recovered_putter_terminal_probe "$code"               > "$OUT/$name-recovered.json"
            python - "$OUT/$name-original.json" "$OUT/$name-recovered.json" "$OUT/$name-comparison.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          b=json.load(open(sys.argv[2]))
          fields=("transition","player_flags","counter_52","counter_56",
                  "pause","terminal_flag","ui_gate","events")
          mismatches={f:(a.get(f),b.get(f)) for f in fields if a.get(f)!=b.get(f)}
          report={"pass":not mismatches,"tolerance":0,"fields":list(fields),"mismatches":mismatches}
          open(sys.argv[3],"w").write(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          assert report["pass"],report
          PY
          }

          run_case cup_code8 7 8
          run_case green_h3_code9 23 9
          run_case green_h2_code10 15 10

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-putter-terminal-parity
          path: analysis/private/gate2-putter-terminal-parity/
          retention-days: 30
