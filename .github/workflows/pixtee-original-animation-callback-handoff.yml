name: Pixtee Original Animation Callback Handoff Parity
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/pixtee-native-portrait-framework]
    paths:
      - 'engine/src/recovered_animation_events.cpp'
      - 'engine/include/sensigolf/recovered_animation_events.hpp'
      - 'pixtee-godot/native/tests/original_animation_callback_handoff_probe.cpp'
      - 'tools/verify_original_animation_callback_handoff.py'
      - '.github/workflows/pixtee-original-animation-callback-handoff.yml'
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'engine/src/recovered_animation_events.cpp'
      - 'engine/include/sensigolf/recovered_animation_events.hpp'
      - 'pixtee-godot/native/tests/original_animation_callback_handoff_probe.cpp'
      - 'tools/verify_original_animation_callback_handoff.py'
      - '.github/workflows/pixtee-original-animation-callback-handoff.yml'
permissions: {contents: read}
jobs:
  original-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Ingest transient SHA-verified original Windows binary
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Compile native handoff and no-execute regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            engine/tests/recovered_animation_events_tests.cpp \
            -o /tmp/pixtee-original-callback-tests
          /tmp/pixtee-original-callback-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            pixtee-godot/native/tests/original_animation_callback_handoff_probe.cpp \
            -o /tmp/pixtee-original-callback-probe
      - name: Verify real x86 0x8000 callback dispatch and post-RET state
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_animation_callback_handoff.py \
            --exe "$EXE" \
            --probe /tmp/pixtee-original-callback-probe \
            -o analysis/private/original-animation-callback-handoff-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-animation-0x8000-handoff-proof
          path: analysis/private/original-animation-callback-handoff-proof.json
          retention-days: 30
