name: Golden Master PRNG Parity

on:
  push:
    paths:
      - ".github/workflows/golden-master-prng.yml"
      - "engine/**"
      - "tools/original_v1014_prng_oracle.py"
      - "tools/original_v1014_oracle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prng:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Build recovered core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Compare exact PRNG sequence
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT="analysis/private/golden-master-prng"
          mkdir -p "$OUT"

          python tools/original_v1014_prng_oracle.py "$WIN_EXE" \
            --seed0 0x1234 --seed1 0xABCD \
            --max 0x200 --max 0x800 --max 0x90 --max 0x11 --max 0xFFFF --max 0x200 \
            -o "$OUT/original.json"

          ./build/engine/sensigolf_recovered_prng_probe \
            0x1234 0xABCD 0x200 0x800 0x90 0x11 0xFFFF 0x200 \
            > "$OUT/recovered.json"

          python - <<'PY'
          import json
          o=json.load(open('analysis/private/golden-master-prng/original.json'))
          r=json.load(open('analysis/private/golden-master-prng/recovered.json'))
          assert o['samples']==r['samples'], (o['samples'],r['samples'])
          print('PRNG zero-tolerance parity:',len(o['samples']),'samples')
          for row in o['samples']: print(row)
          PY
      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-golden-master-prng
          path: analysis/private/golden-master-prng/
          retention-days: 14
