name: Step 3 Original PC Analysis

on:
  push:
    paths:
      - ".github/workflows/step2-original-analysis.yml"
      - "tools/pe_string_xrefs.py"
      - "tools/spt_probe.py"
      - "tools/debug_pointer_probe.py"
      - "tools/gameplay_table_probe.py"

permissions:
  contents: read

jobs:
  analyse-original-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain verified public Sensible Golf v1.014 PC archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          echo "SOURCE=internet-archive" >> "$GITHUB_ENV"
          test "$(sha256sum /tmp/Sensible_Golf_PC.zip | cut -d' ' -f1)" = \
            "7685a9657c50fc2fad77d96d35c68d37b36f0d9cac13d3211727d1ab030b53df"

      - name: Run private ingestion
        run: |
          set -euo pipefail
          python tools/ingest_pc_build.py             /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2

      - name: Probe executables and debug xrefs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/private/probes

          DOS_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFDOS.EXE' -print -quit || true)"
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit || true)"

          if [ -n "$DOS_EXE" ]; then
            python tools/executable_probe.py "$DOS_EXE"               --number 240               -o analysis/private/probes/golfdos-probe.json
          fi

          if [ -n "$WIN_EXE" ]; then
            python tools/executable_probe.py "$WIN_EXE"               --number 240               -o analysis/private/probes/golfwin-probe.json
            python tools/pe_string_xrefs.py "$WIN_EXE"               --context 10               -o analysis/private/probes/golfwin-debug-xrefs.json
            python tools/debug_pointer_probe.py "$WIN_EXE"           --context 8                -o analysis/private/probes/golfwin-debug-pointers.json
            python tools/gameplay_table_probe.py "$WIN_EXE"           -o analysis/private/probes/gameplay-tables.json
          fi

          if [ -f analysis/private/probes/golfdos-probe.json ] &&              [ -f analysis/private/probes/golfwin-probe.json ]; then
            python tools/compare_probes.py               analysis/private/probes/golfdos-probe.json               analysis/private/probes/golfwin-probe.json               -o analysis/private/probes/pc-crosscheck.json
          fi

      - name: Analyse per-hole SPT records
        shell: bash
        run: |
          set -euo pipefail
          python tools/spt_probe.py \
            analysis/private/step2/extracted/epf \
            -o analysis/private/probes/spt-structure.json

      - name: Capture targeted disassembly ranges
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/probes/disasm
          objdump -d -Mintel --start-address=0x40a800 --stop-address=0x40ae40 "$WIN_EXE" > analysis/private/probes/disasm/shot-init.txt
          objdump -d -Mintel --start-address=0x407900 --stop-address=0x407c00 "$WIN_EXE" > analysis/private/probes/disasm/ball-update-a.txt
          objdump -d -Mintel --start-address=0x409e80 --stop-address=0x40a250 "$WIN_EXE" > analysis/private/probes/disasm/ball-setup.txt
          objdump -d -Mintel --start-address=0x40b880 --stop-address=0x40ba20 "$WIN_EXE" > analysis/private/probes/disasm/wind-adjust.txt
          objdump -d -Mintel --start-address=0x40c300 --stop-address=0x40c4d0 "$WIN_EXE" > analysis/private/probes/disasm/green-bounds.txt

      - name: Print targeted recovery summary
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE=$SOURCE"
          cat analysis/private/step2/reports/step2_report.json

          echo "===== DEBUG XREF COUNTS ====="
          python - <<'PY'
          import json
          p='analysis/private/probes/golfwin-debug-xrefs.json'
          j=json.load(open(p))
          for target in j['targets']:
              refs=sum(len(o['references']) for o in target['occurrences'])
              vas=[o['va'] for o in target['occurrences']]
              print(target['text'], 'VAs=',vas, 'refs=',refs)
              for occ in target['occurrences']:
                  for ref in occ['references'][:3]:
                      print('  xref',hex(ref['instruction_address']) if ref['instruction_address'] else None)
                      for line in ref['context']:
                          print('   ',line)
          PY

          echo "===== LIVE DEBUG VARIABLE POINTERS ====="
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/probes/golfwin-debug-pointers.json'))
          for record in j['records']:
              for occ in record['occurrences']:
                  print(record['label'], occ['pointer_hex'], 'refs=',len(occ['code_references']))
                  for ref in occ['code_references'][:5]:
                      print('  xref',hex(ref['instruction_address']) if ref['instruction_address'] else None)
                      print('   ',ref['line'])
          PY

          echo "===== GAMEPLAY TABLES ====="
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/probes/gameplay-tables.json'))
          print(json.dumps({
              'trig': j['trig'],
              'accuracy': j['accuracy'],
              'launch_mapping': j['launch_mapping'],
              'launch_records': j['launch_records'],
          }, indent=2))
          PY

          echo "===== SPT STRUCTURE ====="
          cat analysis/private/probes/spt-structure.json

      - name: Upload metadata-only reports
        uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-metadata
          path: |
            analysis/private/step2/reports/
            analysis/private/probes/
          if-no-files-found: error
          retention-days: 7
