name: Sensible Golf Full Original Android Shell - Build Verification

on:
  push:
    paths:
      - 'android-full/**'
      - 'tools/build_original_dosz.py'
      - 'tests/test_original_dosz.py'
      - '.github/workflows/sensigolf-full-android-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-full-game-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Test full original ZIP packager
        run: python -m unittest discover -s tests -p 'test_original_dosz.py' -v
      - name: Check out pinned GPL runtimes
        run: |
          set -euo pipefail
          mkdir -p android-full/vendor
          git clone --quiet https://github.com/Swordfish90/LibretroDroid.git android-full/vendor/LibretroDroid
          git -C android-full/vendor/LibretroDroid checkout -q 8835c3098514390a271e36983957f7bb5f40abf1
          # This project uses the workflow-managed Gradle; no vendored wrapper binaries.
          rm -rf android-full/vendor/LibretroDroid/gradle/wrapper
          git clone --quiet https://github.com/libretro/dosbox-pure.git android-full/vendor/dosbox-pure
          git -C android-full/vendor/dosbox-pure checkout -q cdaea10ce8cac231bc341ca05d4c5e4e5fe0fbd5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile DOSBox Pure native Android library
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd android-full/vendor/dosbox-pure
          # Upstream's Android.mk wildcard returns paths prefixed by jni/.
          # NDK resolves LOCAL_SRC_FILES relative to jni/, so strip it once.
          sed -i 's@LOCAL_SRC_FILES    := $(SOURCES)@LOCAL_SRC_FILES    := $(patsubst $(LOCAL_PATH)/%,%,$(SOURCES))@' jni/Android.mk
          "$ANDROID_NDK_HOME/ndk-build" -C . APP_ABI="arm64-v8a x86_64" BUILD=RELEASE -j3
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a ../../app/src/main/jniLibs/x86_64
          for abi in arm64-v8a x86_64; do
            cp "libs/$abi/libretro.so" "../../app/src/main/jniLibs/$abi/libdosbox_pure_libretro_android.so"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile host Android app with native emulator core
        run: gradle -p android-full --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect integration artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=android-full/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep lib/arm64-v8a/libdosbox_pure_libretro_android.so
          unzip -l "$APK" | grep lib/x86_64/libdosbox_pure_libretro_android.so
          unzip -l "$APK" | grep lib/arm64-v8a/liblibretrodroid.so
          echo "PASS: frontend and native original DOS runtime compile."
      # No APK is uploaded: debug without the private original game copy
      # is not a playable full-game build and must never be presented as one.
