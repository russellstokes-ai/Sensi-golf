name: Gate 1 Meter And Tick Closure

on:
  push:
    paths:
      - ".github/workflows/gate1-meter-tick-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace complete meter and tick producer
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate1-meter-tick
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x4078D8 --end-va 0x407990 \
            -o "$OUT/meter-tail.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x42DBE8 --va 0x42DBE9 --radius 60 \
            -o "$OUT/tick-byte-xrefs.json"

          python - <<'PY'
          import json
          print('=== METER TAIL ===')
          j=json.load(open('analysis/private/gate1-meter-tick/meter-tail.json'))
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== TICK BYTE XREFS ===')
          j=json.load(open('analysis/private/gate1-meter-tick/tick-byte-xrefs.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-meter-tick-closure
          path: analysis/private/gate1-meter-tick/
          retention-days: 14
