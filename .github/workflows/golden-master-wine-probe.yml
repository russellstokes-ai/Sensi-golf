name: Golden Master Wine Probe

on:
  push:
    paths:
      - ".github/workflows/golden-master-wine-probe.yml"
      - "tools/wine_parent_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wine and X11 automation
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb xdotool x11-utils imagemagick unzip

      - name: Fetch verified v1.014 package
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Boot original at 8-bit colour and sample as parent
        shell: bash
        run: |
          set -uo pipefail
          export DISPLAY=:99
          export WINEPREFIX="$RUNNER_TEMP/wineprefix"
          # Keep crash/loader diagnostics for this compatibility probe.
          export WINEDEBUG=+seh,+module
          Xvfb :99 -screen 0 800x600x8 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          wineboot -u >/tmp/wineboot.log 2>&1 || true

          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          python tools/wine_parent_probe.py "$WIN_EXE"             --duration-s 12 --interval-ms 20             -o analysis/private/wine-ball-probe.json             --stdout /tmp/golfwin.stdout --stderr /tmp/golfwin.stderr
          PROBE_RC=$?

          echo "=== windows ==="
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null || true
          echo "=== tree ==="
          xwininfo -root -tree || true
          import -window root "$GITHUB_WORKSPACE/analysis/private/wine-root.png" || true

          kill "$XVFB_PID" 2>/dev/null || true
          exit "$PROBE_RC"

      - name: Print probe summary
        if: always()
        run: |
          echo "=== probe ==="
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('analysis/private/wine-ball-probe.json')
          if p.exists():
              j=json.loads(p.read_text())
              print('pid',j['pid'],'rc',j['returncode'],'samples',j['sample_count'])
              print('errors',j['errors'][-10:])
              for row in j['samples'][:20]: print(row)
          PY
          echo "=== stderr tail ==="
          tail -200 /tmp/golfwin.stderr 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-golden-master-wine-probe
          path: |
            analysis/private/wine-root.png
            analysis/private/wine-ball-probe.json
            /tmp/golfwin.stdout
            /tmp/golfwin.stderr
            /tmp/xvfb.log
            /tmp/wineboot.log
          if-no-files-found: ignore
          retention-days: 7
