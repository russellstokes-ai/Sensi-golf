name: Pixtee Original Animation Event Queue Source Parity
on:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_animation_event_queue.py'
      - 'tools/verify_original_animation_event_tick.py'
      - 'pixtee-godot/native/tests/original_animation_event_tick_probe.cpp'
      - 'engine/src/recovered_animation_events.cpp'
      - 'engine/include/sensigolf/recovered_animation_events.hpp'
      - 'pixtee-godot/native/tests/original_animation_event_queue_probe.cpp'
      - '.github/workflows/pixtee-original-animation-events.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  authentic-animated-event-enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Ingest original verified source binary transiently
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Native original animation event allocator regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            engine/tests/recovered_animation_events_tests.cpp \
            -o /tmp/pixtee-original-animation-event-unit
          /tmp/pixtee-original-animation-event-unit
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            pixtee-godot/native/tests/original_animation_event_queue_probe.cpp \
            -o /tmp/pixtee-original-animation-event-probe
      - name: Compare authentic original 10-slot C++ and source x86 event queue
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_animation_event_queue.py \
            --exe "$EXE" --probe /tmp/pixtee-original-animation-event-probe \
            -o analysis/private/original-animation-event-slot-x86.json
      - name: Source-original per-event 10-slot timer dispatcher parity
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            pixtee-godot/native/tests/original_animation_event_tick_probe.cpp \
            -o /tmp/pixtee-original-animation-tick-probe
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_animation_event_tick.py \
            --exe "$EXE" --probe /tmp/pixtee-original-animation-tick-probe \
            -o analysis/private/original-animation-timer-tick-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-animation-event-queue
          path: |
            analysis/private/original-animation-event-slot-x86.json
            analysis/private/original-animation-timer-tick-x86.json
          retention-days: 30
