name: Gate 2 Score Counter Lifecycle

on:
  push:
    paths:
      - ".github/workflows/gate2-score-counter-lifecycle.yml"
      - "tools/original_v1014_score_counter_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install emulator
        run: python -m pip install --disable-pip-version-check unicorn

      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Trace original launch and terminal counter lifecycle
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-score-counter-lifecycle
          mkdir -p "$OUT"
          python tools/original_v1014_score_counter_lifecycle.py "$WIN_EXE" \
            -o "$OUT/result.json"
          cat "$OUT/result.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-gate2-score-counter-lifecycle
          path: analysis/private/gate2-score-counter-lifecycle/
          retention-days: 30
