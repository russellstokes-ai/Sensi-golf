name: Pixtee Original Special Green Terminal Matrix
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_special_green_terminal.py'
      - 'pixtee-godot/native/tests/original_special_terminal_probe.cpp'
      - 'engine/src/recovered_putter_terminal.cpp'
      - '.github/workflows/pixtee-original-special-terminal-matrix.yml'
permissions:
  contents: read
jobs:
  original_putter_terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_putter_terminal.cpp \
            pixtee-godot/native/tests/original_special_terminal_probe.cpp \
            -o /tmp/special-terminal
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_special_green_terminal.py \
            --exe "$EXE" --probe /tmp/special-terminal \
            -o analysis/private/original-special-terminal-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-putter-codes-8-9-10-state-matrix
          path: analysis/private/original-special-terminal-x86.json
          retention-days: 30
