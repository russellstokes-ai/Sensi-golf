name: Golden Master Original Green Slope Oracle

on:
  push:
    paths:
      - ".github/workflows/golden-master-green-slope-oracle.yml"
      - "tools/original_v1014_putter_oracle.py"
      - "tools/original_v1014_oracle.py"
      - "tools/original_v1014_flat_oracle.py"
      - "tools/pe_target_xrefs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slope-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Locate original executable
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          test -n "$WIN_EXE"
          echo "WIN_EXE=$WIN_EXE" >> "$GITHUB_ENV"
      - name: Capture controlled original green slopes
        shell: bash
        run: |
          set -euo pipefail
          out="analysis/private/golden-master-green-slope"
          mkdir -p "$out"

          run_case() {
            name="$1"; slope_dir="$2"; slope_mag="$3"
            python tools/original_v1014_putter_oracle.py "$WIN_EXE" \
              --power 30 --accuracy 63 --direction 0 --max-ticks 128 \
              --slope-direction "$slope_dir" --slope-magnitude "$slope_mag" \
              -o "$out/${name}.json"
            python -c 'import json,sys; j=json.load(open(sys.argv[1])); print(sys.argv[2], j["slope"], "rest", j["events"]["rest"], "samples", len(j["samples"]))' \
              "$out/${name}.json" "$name"
          }

          run_case slope_forward 0 1
          run_case slope_right 1024 1
          run_case slope_diagonal 512 3

      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-original-green-slope-oracle
          path: analysis/private/golden-master-green-slope/
          retention-days: 14
