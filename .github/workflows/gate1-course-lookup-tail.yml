name: Gate 1 Course Lookup Tail

on:
  push:
    paths:
      - ".github/workflows/gate1-course-lookup-tail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Disassemble lookup tail
        run: |
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/gate1-course-lookup-tail
          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x409640 --end-va 0x4096A0 \
            -o analysis/private/gate1-course-lookup-tail/tail.json
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate1-course-lookup-tail/tail.json'))
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-gate1-course-lookup-tail
          path: analysis/private/gate1-course-lookup-tail/
          retention-days: 14
