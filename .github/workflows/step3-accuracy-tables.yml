name: Step 3 Accuracy Tables

on:
  push:
    paths:
      - ".github/workflows/step3-accuracy-tables.yml"

permissions:
  contents: read

jobs:
  tables:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and ingest
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Extract exact accuracy tables
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3
          python tools/extract_accuracy_tables.py "$WIN_EXE" \
            -o analysis/private/step3/accuracy-tables.json
          cat analysis/private/step3/accuracy-tables.json
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-accuracy-tables
          path: analysis/private/step3/accuracy-tables.json
          retention-days: 7
