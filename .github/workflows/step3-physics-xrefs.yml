name: Step 3 Physics Xrefs

on:
  push:
    paths:
      - ".github/workflows/step3-physics-xrefs.yml"

permissions:
  contents: read

jobs:
  xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Fetch public PC archive
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Trace physics debug string references
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3
          python tools/pe_target_xrefs.py "$WIN_EXE"             --targets-file reference/physics_debug_targets.txt             --disassemble             --radius 28             -o analysis/private/step3/physics-xrefs.json

      - name: Summarise xrefs
        run: |
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/step3/physics-xrefs.json'))
          print("targets_found",len(j["targets"]))
          print("xrefs_found",len(j.get("xrefs",[])))
          for x in j.get("xrefs",[]):
              t=x["target"]
              print("\n===",t["text"],"target_va",hex(t["va"]),"xref",hex(x["xref_va"]),"===")
              for ins in x["instructions"]:
                  mark=">>" if ins["address"]==x["xref_va"] else "  "
                  print(f'{mark} {ins["address"]:08x}  {ins["mnemonic"]:8} {ins["op_str"]}')
          PY

      - name: Upload metadata-only xref report
        uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-physics-xrefs
          path: analysis/private/step3/physics-xrefs.json
          retention-days: 7
