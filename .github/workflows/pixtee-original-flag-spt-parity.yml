name: Pixtee Original Flag SPT Loader Source Parity
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_flag_spt_setup.py'
      - 'pixtee-godot/native/tests/original_flag_spt_setup_probe.cpp'
      - 'engine/src/recovered_flag_setup.cpp'
      - 'engine/include/sensigolf/recovered_flag_setup.hpp'
      - '.github/workflows/pixtee-original-flag-spt-parity.yml'
permissions: {contents: read}
jobs:
  authentic-flag-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Original source EXE and test-only original course resource
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Build native source flag-loader probe
        run: |
          cmake -S . -B /tmp/pixtee-flag-probe -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/pixtee-flag-probe --target sensigolf_core -j 2
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            pixtee-godot/native/tests/original_flag_spt_setup_probe.cpp \
            /tmp/pixtee-flag-probe/engine/libsensigolf_core.a \
            -o /tmp/pixtee-original-flag-setup
      - name: Compare original x86 SPT flag source setup with recovered engine
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_flag_spt_setup.py \
            --exe "$EXE" --probe /tmp/pixtee-original-flag-setup \
            -o analysis/private/original-flag-spt-setup-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-spt-flag-source-parity
          path: analysis/private/original-flag-spt-setup-x86.json
          retention-days: 30
