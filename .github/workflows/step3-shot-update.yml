name: Step 3 Shot Update Disassembly

on:
  push:
    paths:
      - ".github/workflows/step3-shot-update.yml"

permissions:
  contents: read

jobs:
  shot-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest public PC archive
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Disassemble candidate shot update region
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3
          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40a250 \
            --end-va 0x40a700 \
            -o analysis/private/step3/shot-update-disasm.json
      - name: Print disassembly
        run: |
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/step3/shot-update-disasm.json'))
          for ins in j['instructions']:
              print(f"{ins['address']:08x} {ins['mnemonic']:8} {ins['op_str']}")
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-shot-update
          path: analysis/private/step3/shot-update-disasm.json
          retention-days: 7
