name: Pixtee Original Flag Contact Activation
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_flag_activation.py'
      - 'pixtee-godot/native/tests/original_flag_activation_probe.cpp'
      - 'engine/src/recovered_interactions.cpp'
      - '.github/workflows/pixtee-original-flag-activation.yml'
permissions:
  contents: read
jobs:
  original_flag_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_prng.cpp engine/src/recovered_interactions.cpp \
            pixtee-godot/native/tests/original_flag_activation_probe.cpp \
            -o /tmp/flag-gate
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_flag_activation.py \
            --exe "$EXE" --probe /tmp/flag-gate \
            -o analysis/private/original-flag-gate-x86.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-flag-x86-event-activation
          path: analysis/private/original-flag-gate-x86.json
          retention-days: 30
