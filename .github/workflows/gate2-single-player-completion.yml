name: Gate 2 Single Player Completion Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-single-player-completion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace final single-player hole flow and score fields
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-single-player-completion
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40BE80 --end-va 0x40C120 \
            -o "$OUT/completion.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x412560 --end-va 0x4126A0 \
            -o "$OUT/score-update.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x40BEF4 --va 0x4125AB --va 0x40BFE2 \
            --va 0x425FE2 --radius 80 -o "$OUT/flow-xrefs.json"

          python tools/scan_struct_offsets.py "$WIN_EXE" \
            --offset 0x52 --offset 0x56 --offset 0x58 --offset 0x5e \
            --radius 26 -o "$OUT/score-field-xrefs.json"

          python - <<'PY'
          import json
          for fn in ('completion','score-update'):
              print('\n===',fn,'===')
              j=json.load(open(f'analysis/private/gate2-single-player-completion/{fn}.json'))
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-single-player-completion
          path: analysis/private/gate2-single-player-completion/
          retention-days: 30
