name: Gate 2 Special Landing Tail Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-special-landing-tail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Disassemble landing tail and helper callers
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT="analysis/private/gate2-special-landing-tail"
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE"             --start-va 0x40A7D0 --end-va 0x40AA90             -o "$OUT/landing-tail.json"

          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x40A7E0 --va 0x40A800 --va 0x40A900 --va 0x40A96F             --radius 48 -o "$OUT/tail-xrefs.json"

          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x41EF66 --va 0x41F883 --va 0x41F885 --va 0x41F886             --radius 32 -o "$OUT/state-xrefs.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-special-landing-tail/landing-tail.json'))
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-special-landing-tail
          path: analysis/private/gate2-special-landing-tail/
          retention-days: 30
