name: Pixtee Original CPU And Object Dispatcher Recovery
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/trace_original_cpu_object_dispatcher.py'
      - '.github/workflows/pixtee-original-cpu-object-disassembly.yml'
permissions:
  contents: read
jobs:
  original-cpu-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Acquire and validate original executable transiently
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Disassemble original computer shot and tree/object source
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/trace_original_cpu_object_dispatcher.py \
            --exe "$EXE" -o analysis/private/original-cpu-object-disassembly.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-cpu-object-source-disassembly
          path: analysis/private/original-cpu-object-disassembly.json
          retention-days: 30
