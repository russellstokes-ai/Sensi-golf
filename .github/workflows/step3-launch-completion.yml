name: Step 3 Launch Completion

on:
  push:
    paths:
      - ".github/workflows/step3-launch-completion.yml"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Fetch and ingest
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Trace launch/profile selection
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3/launch-completion

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40a030 --end-va 0x40a1d5 \
            -o analysis/private/step3/launch-completion/profile-selection.json

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x4078d8 --end-va 0x407990 \
            -o analysis/private/step3/launch-completion/meter-tail.json

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41f204 --va 0x41f32c --va 0x41d59e --va 0x41d59c \
            --radius 32 \
            -o analysis/private/step3/launch-completion/launch-xrefs.json

      - name: Print
        run: |
          python - <<'PY'
          import json,glob,os
          for p in sorted(glob.glob('analysis/private/step3/launch-completion/*.json')):
              j=json.load(open(p))
              print("\n====",os.path.basename(p),"====")
              if 'instructions' in j:
                  for i in j['instructions']:
                      print(f'{i["address"]:08x} {i["mnemonic"]:8} {i["op_str"]}')
              else:
                  print("xref_count",len(j.get('xrefs',[])))
                  for x in j.get('xrefs',[]):
                      print("\nXREF",hex(x['xref_va']),[hex(v) for v in x['targets']])
                      for i in x['instructions']:
                          mark='>>' if i['address']==x['xref_va'] else '  '
                          print(f'{mark} {i["address"]:08x} {i["mnemonic"]:8} {i["op_str"]}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-launch-completion
          path: analysis/private/step3/launch-completion/
          retention-days: 7
