name: Pixtee Original Multiplayer Turn Score Correction
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'pixtee-godot/native/src/original_turn_score_adjust.*'
      - 'pixtee-godot/native/tests/original_turn_score_adjust_probe.cpp'
      - 'tools/verify_original_turn_score_adjust.py'
      - '.github/workflows/pixtee-original-turn-score.yml'
permissions:
  contents: read
jobs:
  original_score_adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_turn_score_adjust.cpp \
            pixtee-godot/native/tests/original_turn_score_adjust_probe.cpp \
            -o /tmp/original-turn-score
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_turn_score_adjust.py \
            --exe "$EXE" --probe /tmp/original-turn-score \
            -o analysis/private/original-turn-score-x86.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-turn-score-x86-parity
          path: analysis/private/original-turn-score-x86.json
          retention-days: 30
