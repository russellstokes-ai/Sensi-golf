name: Gate 2 Distance Formula Parity

on:
  push:
    paths:
      - ".github/workflows/gate2-distance-formula-parity.yml"
      - "tools/original_v1014_distance_oracle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Compare recovered formula with original helper
        run: |
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/gate2-distance-formula
          python tools/original_v1014_distance_oracle.py "$WIN_EXE" \
            -o analysis/private/gate2-distance-formula/result.json
          cat analysis/private/gate2-distance-formula/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-distance-formula
          path: analysis/private/gate2-distance-formula/
          retention-days: 30
