name: Pixtee Original Next Player Selection Oracle
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_next_player.py'
      - 'pixtee-godot/native/src/original_next_player.*'
      - 'pixtee-godot/native/tests/original_next_player_probe.cpp'
      - '.github/workflows/pixtee-original-next-player.yml'
permissions:
  contents: read
jobs:
  original_player_selector:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Compile portable original next-player branch
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_next_player.cpp \
            pixtee-godot/native/tests/original_next_player_probe.cpp \
            -o /tmp/pixtee-next-player
      - name: Compare every source x86 selection to C++ on varied multiplayer states
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_next_player.py --exe "$EXE" \
            --probe /tmp/pixtee-next-player \
            -o analysis/private/original-next-player-source-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-next-player-machine-parity-evidence
          path: analysis/private/original-next-player-source-parity.json
          retention-days: 30
