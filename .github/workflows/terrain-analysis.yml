name: Terrain Descriptor Analysis

on:
  push:
    paths:
      - ".github/workflows/terrain-analysis.yml"
      - "tools/terrain_descriptor_probe.py"
      - "tools/pe_disasm_range.py"
      - "tools/pe_target_xrefs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Analyse terrain lookup and descriptors
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/terrain

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x4094f0 --end-va 0x409535 \
            -o analysis/private/terrain/terrain-state-helper-disasm.json

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x409535 --end-va 0x409650 \
            -o analysis/private/terrain/terrain-lookup-disasm.json

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x409bf4 --end-va 0x409f80 \
            -o analysis/private/terrain/pre-shot-lie-disasm.json

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40b935 --end-va 0x40ba00 \
            -o analysis/private/terrain/terrain-slope-disasm.json

          python tools/terrain_descriptor_probe.py "$WIN_EXE" --count 128 \
            -o analysis/private/terrain/terrain-descriptors.json

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/terrain/terrain-descriptors.json'))
          print('named descriptors:')
          for row in j['rows']:
              if row.get('mapped') and row.get('name'):
                  print(row['index'], row['landing_code'], row['variant_signed'], row['profile_slot'], row['name'])
          print('\nprofile slots:')
          for k,v in sorted(j['indices_by_profile_slot'].items(), key=lambda kv:int(kv[0])):
              print(k, v)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-terrain-analysis
          path: analysis/private/terrain/
          retention-days: 14
