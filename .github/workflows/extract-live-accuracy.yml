name: Extract Live Accuracy Tables

on:
  push:
    paths:
      - ".github/workflows/extract-live-accuracy.yml"
      - "tools/extract_live_accuracy_tables.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and ingest reference build
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Extract live accuracy data
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/live-accuracy
          python tools/extract_live_accuracy_tables.py "$WIN_EXE" \
            -o analysis/private/live-accuracy/live-accuracy.json
          cat analysis/private/live-accuracy/live-accuracy.json
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-live-accuracy
          path: analysis/private/live-accuracy/live-accuracy.json
          retention-days: 14
