name: Step 3 Physics Ranges

on:
  push:
    paths:
      - ".github/workflows/step3-physics-ranges.yml"

permissions:
  contents: read

jobs:
  ranges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Disassemble candidate physics regions
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3/ranges
          python tools/pe_disasm_range.py "$WIN_EXE" --start-va 0x40a900 --end-va 0x40aa20 -o analysis/private/step3/ranges/swing-adjust.json
          python tools/pe_disasm_range.py "$WIN_EXE" --start-va 0x40c7f0 --end-va 0x40c890 -o analysis/private/step3/ranges/shot-init.json
          python tools/pe_disasm_range.py "$WIN_EXE" --start-va 0x40caf0 --end-va 0x40ccd0 -o analysis/private/step3/ranges/ball-update.json
      - name: Print assembly
        run: |
          python - <<'PY'
          import json,glob,os
          for p in sorted(glob.glob('analysis/private/step3/ranges/*.json')):
              j=json.load(open(p))
              print("\n====",os.path.basename(p),hex(j["start_va"]),hex(j["end_va"]),"====")
              for i in j["instructions"]:
                  print(f'{i["address"]:08x} {i["mnemonic"]:8} {i["op_str"]}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-physics-ranges
          path: analysis/private/step3/ranges/
          retention-days: 7
