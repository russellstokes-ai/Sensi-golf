name: Gate 2 Original Scoring Oracle

on:
  push:
    paths:
      - ".github/workflows/gate2-original-scoring-oracle.yml"
      - "tools/original_v1014_scoring_oracle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install emulator/disassembler
        run: python -m pip install --disable-pip-version-check unicorn capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Run continuous scoring oracle
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-original-scoring
          mkdir -p "$OUT"

          python tools/original_v1014_scoring_oracle.py "$WIN_EXE" \
            -o "$OUT/oracle.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40AD1D --end-va 0x40AE40 \
            -o "$OUT/live-launch.json"

          cat "$OUT/oracle.json"
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-original-scoring/live-launch.json'))
          print('=== live launch ===')
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-original-scoring-oracle
          path: analysis/private/gate2-original-scoring/
          retention-days: 30
