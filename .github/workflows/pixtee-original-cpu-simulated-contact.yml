name: Pixtee Original CPU Simulated Contact Source Parity
on:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_cpu_simulated_contact.py'
      - 'pixtee-godot/native/src/original_cpu_simulated_contact.*'
      - 'pixtee-godot/native/tests/original_cpu_simulated_contact_*'
      - '.github/workflows/pixtee-original-cpu-simulated-contact.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-cpu-gravity-lip:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Retrieve SHA verified original Windows executable
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Compile native CPU trial gravity contact and selftests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_cpu_simulated_contact.cpp \
            pixtee-godot/native/tests/original_cpu_simulated_contact_tests.cpp \
            -o /tmp/ai-candidate-contact-tests
          /tmp/ai-candidate-contact-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_cpu_simulated_contact.cpp \
            pixtee-godot/native/tests/original_cpu_simulated_contact_probe.cpp \
            -o /tmp/ai-candidate-contact-probe
      - name: Original machine-code source comparison
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_cpu_simulated_contact.py \
            --exe "$EXE" --probe /tmp/ai-candidate-contact-probe \
            -o analysis/private/original-ai-candidate-gravity-contact-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-cpu-candidate-contact-source
          path: analysis/private/original-ai-candidate-gravity-contact-x86.json
          retention-days: 30
