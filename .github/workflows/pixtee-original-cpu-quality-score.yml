name: Pixtee Original CPU Candidate Score Formula Source Parity
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_cpu_quality_score.py'
      - 'tools/verify_original_cpu_reference_penalties.py'
      - 'pixtee-godot/native/tests/original_cpu_reference_penalty_probe.cpp'
      - 'pixtee-godot/native/src/original_cpu_quality_score.*'
      - 'pixtee-godot/native/tests/original_cpu_quality_score_*'
      - '.github/workflows/pixtee-original-cpu-quality-score.yml'
permissions: {contents: read}
jobs:
  source-candidate-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Acquire original GOLFWIN v1.014 SHA checked (temporary only)
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/pixtee-ingest.json
      - name: Native CPU original quality formula regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_cpu_quality_score.cpp \
            pixtee-godot/native/tests/original_cpu_quality_score_tests.cpp \
            -o /tmp/pixtee-original-cpu-quality-tests
          /tmp/pixtee-original-cpu-quality-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_cpu_quality_score.cpp \
            pixtee-godot/native/tests/original_cpu_quality_score_probe.cpp \
            -o /tmp/pixtee-original-cpu-quality-probe
      - name: Compare original machine record quality with native source formula
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_cpu_quality_score.py \
            --exe "$EXE" --probe /tmp/pixtee-original-cpu-quality-probe \
            -o analysis/private/original-cpu-quality-x86.json
      - name: Verify genuine unmodified original 32-WORD CPU penalty table
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_cpu_quality_score.cpp \
            pixtee-godot/native/tests/original_cpu_reference_penalty_probe.cpp \
            -o /tmp/pixtee-source-cpu-penalty-probe
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_cpu_reference_penalties.py \
            --exe "$EXE" --probe /tmp/pixtee-source-cpu-penalty-probe \
            -o analysis/private/original-cpu-reference-penalties-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-source-cpu-distance-penalty-score
          path: |
            analysis/private/original-cpu-quality-x86.json
            analysis/private/original-cpu-reference-penalties-x86.json
          retention-days: 30
