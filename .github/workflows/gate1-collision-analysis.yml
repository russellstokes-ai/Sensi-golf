name: Gate 1 Collision Analysis

on:
  push:
    paths:
      - ".github/workflows/gate1-collision-analysis.yml"
      - "tools/collision_anchor_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Probe collision and object anchors
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          EPF_ROOT="analysis/private/step2/extracted/epf"
          OUT="analysis/private/gate1-collision"
          mkdir -p "$OUT"

          python tools/collision_anchor_probe.py "$WIN_EXE" \
            --epf-root "$EPF_ROOT" \
            -o "$OUT/anchors.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A603 --end-va 0x40AA78 \
            -o "$OUT/full-ball-update.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate1-collision/anchors.json'))
          print('=== candidate strings ===')
          for x in j['candidate_strings']: print(x)
          print('\n=== debug descriptors ===')
          for x in j['debug_descriptors']: print(x)
          print('\n=== string xrefs ===')
          for x in j['string_xrefs']:
              print('XREF',hex(x['xref_va']),x['target']['text'])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== EPF candidates ===')
          for x in j['epf_candidates']: print(x)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-collision-analysis
          path: analysis/private/gate1-collision/
          retention-days: 14
