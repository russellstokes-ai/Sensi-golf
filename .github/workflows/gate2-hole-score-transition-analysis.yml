name: Gate 2 Hole Score Transition Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-hole-score-transition-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace par, hole index and next-hole flow
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-hole-score-transition
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40CD40 --end-va 0x40D760 \
            -o "$OUT/completion-and-next-hole.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x42952B --va 0x425580 --va 0x4255DE --va 0x4255E0 \
            --va 0x41E603 --va 0x41F883 --va 0x420FEE --va 0x420FEF \
            --radius 56 -o "$OUT/state-xrefs.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x40CD4A --va 0x40CE09 --va 0x40CFE9 --va 0x40D630 \
            --radius 72 -o "$OUT/flow-xrefs.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-hole-score-transition/completion-and-next-hole.json'))
          print('=== completion/next-hole ===')
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-hole-score-transition-analysis
          path: analysis/private/gate2-hole-score-transition/
          retention-days: 30
