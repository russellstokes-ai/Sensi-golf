name: Pixtee Original Welly Outer Input Scheduler Recovery
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/trace_original_welly_outer_scheduler.py'
      - '.github/workflows/pixtee-original-welly-outer-scheduler.yml'
permissions: {contents: read}
jobs:
  original-welly-caller-xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Load hash-verified original game for offline machine inspection
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Trace original Welly rising and falling outer callers and input state
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/trace_original_welly_outer_scheduler.py \
            --exe "$EXE" -o analysis/private/original-welly-outer-xrefs.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-meter-outer-source-index
          path: analysis/private/original-welly-outer-xrefs.json
          retention-days: 30
