name: Gate 2 Continuous Two-Hole Round

on:
  push:
    paths:
      - ".github/workflows/gate2-continuous-two-hole-round.yml"
      - "engine/tools/classic_real_two_hole_round_probe.cpp"
      - "engine/include/sensigolf/classic_hole_session.hpp"
      - "engine/src/classic_hole_session.cpp"
      - "engine/include/sensigolf/classic_game_session.hpp"
      - "engine/src/classic_game_session.cpp"
      - "engine/include/sensigolf/classic_round_session.hpp"
      - "engine/src/classic_round_session.cpp"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn

      - name: Fetch and verify original Windows v1.014
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fLSs --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip; then
            curl -fLSs --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://archive.org/download/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
              -o /tmp/Sensible_Golf_PC.zip
          fi
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Build portable core and all C++ regression tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure

      - name: Verify original order and replay two holes continuously
        shell: bash
        run: |
          set -euo pipefail
          ROOT="analysis/private/step2/extracted/epf"
          OUT="analysis/private/gate2-continuous-two-hole-round"
          mkdir -p "$OUT"
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          python tools/original_v1014_next_hole_resources.py "$WIN_EXE" \
            -o "$OUT/original-resource-metadata.json"

          python - "$OUT/original-resource-metadata.json" <<'PY'
          import json,sys
          src=json.load(open(sys.argv[1]))
          order=next(x["hole_ids"] for x in src["orders"] if x["slot"]==0)
          assert order[:3]==[42,50,58],order[:3]
          assert [src["par_by_resource_id"][i] for i in order[:3]]==[4,4,3]
          print("verified original course order and pars:",order[:3])
          PY

          ./build/engine/sensigolf_real_two_hole_round_probe \
            "$ROOT" 42 4 50 4 58 3 0 | tee "$OUT/result.json"

          python - "$OUT/result.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["resources"]==[42,50,58],j
          assert j["completed_strokes"]==[3,4],j
          assert j["holes_completed"]==2 and j["total_strokes"]==7,j
          assert j["cumulative_par"]==8 and j["relative_to_par"]==1,j
          assert j["next_loaded"] is True,j
          assert j["next_tee"]==[370,383] and j["next_cup"]==[138,96],j
          print("continuous original two-hole round passed:",json.dumps(j,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-continuous-two-hole-round
          path: analysis/private/gate2-continuous-two-hole-round/
          retention-days: 30
