name: Pixtee Godot original-data research bank
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'pixtee-godot/reference/**'
      - 'pixtee-godot/tools/verify_reference_data.py'
      - 'tools/validate_pixtee_physics_reference.py'
      - 'engine/src/recovered_flight.cpp'
      - 'engine/src/classic_terrain.cpp'
      - 'spec/pixtee/ORIGINAL_PHYSICS_RESEARCH.json'
      - 'engine/tests/fixtures/original_round_all_eighteen.txt'
jobs:
  original-data-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-derived engine tables and 18-hole research fixture
        run: python3 pixtee-godot/tools/verify_reference_data.py
