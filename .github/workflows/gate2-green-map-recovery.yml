name: Gate 2 Green Map Recovery

on:
  push:
    paths:
      - ".github/workflows/gate2-green-map-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.6 unicorn
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace green/main map ownership
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          ROOT="analysis/private/step2/extracted/epf"
          OUT="analysis/private/gate2-green-map-recovery"
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x4094D0 --end-va 0x4096C0 \
            -o "$OUT/course-lookup.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x4089D0 --end-va 0x408C20 \
            -o "$OUT/resource-loader.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41EE7A --va 0x41EE22 --va 0x41EE26 \
            --va 0x41EE06 --va 0x41EE0A --va 0x41EE0E --va 0x41EE12 \
            --va 0x41EE1A --va 0x41EE1E --va 0x41EE2A \
            --va 0x41E5EC --va 0x41E5EE --va 0x41E5F0 --va 0x41E5F2 \
            --va 0x41EF00 --va 0x41EF0B --va 0x41EF16 \
            --radius 128 -o "$OUT/green-map-xrefs.json"

          python - "$ROOT/MAPM42.MAP" "$ROOT/MAPS42.MAP" "$ROOT/MAPM42.SPT" "$OUT/resource-headers.json" <<'PY'
          import hashlib,json,struct,sys
          rows={}
          for label,path in [("MAPM42",sys.argv[1]),("MAPS42",sys.argv[2])]:
              b=open(path,"rb").read()
              rows[label]={
                  "size":len(b),
                  "sha256":hashlib.sha256(b).hexdigest(),
                  "width_be":struct.unpack(">H",b[0x54:0x56])[0] if len(b)>=0x58 else None,
                  "height_be":struct.unpack(">H",b[0x56:0x58])[0] if len(b)>=0x58 else None,
                  "header_0x50_0x60":b[0x50:0x60].hex() if len(b)>=0x60 else None,
              }
          s=open(sys.argv[3],"rb").read()
          rows["SPT42"]={
              "size":len(s),
              "records":[list(struct.unpack(">5H",s[i:i+10])) for i in range(0,len(s),10)]
          }
          open(sys.argv[4],"w").write(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          PY

          python - "$ROOT/MAPM42.MAP" "$ROOT/MAPS42.MAP" "$ROOT/MAPM42.SPT" "$OUT/green-origin.json" <<'PY'
          import json,struct,sys

          main=open(sys.argv[1],"rb").read()
          green=open(sys.argv[2],"rb").read()
          spt=open(sys.argv[3],"rb").read()

          width=struct.unpack(">H",main[0x54:0x56])[0]
          height=struct.unpack(">H",main[0x56:0x58])[0]
          markers=[]
          off=0x60
          for y in range(height):
              for x in range(width):
                  word=struct.unpack(">H",main[off:off+2])[0]
                  off+=2
                  # v1.014 0x409687 records MAPM entries whose first byte
                  # has top bits 111, storing x<<4 / y<<3.
                  first=(word>>8)&0xff
                  if (first & 0xe0)==0xe0:
                      markers.append({
                          "tile_x":x,
                          "tile_y":y,
                          "world_x":x<<4,
                          "world_y":y<<3,
                          "word":word,
                      })

          assert markers, "no v1.014 green-origin markers found"
          origin_x=markers[0]["world_x"]
          origin_y=markers[0]["world_y"]
          cup_x,cup_y=struct.unpack(">HH",spt[44:48])
          local_cup_x=(cup_x-origin_x)*2
          local_cup_y=(cup_y-origin_y)*2

          gw=struct.unpack(">H",green[0x54:0x56])[0]
          gh=struct.unpack(">H",green[0x56:0x58])[0]
          def green_tile(x,y):
              tx=x>>4; ty=y>>3
              assert 0<=tx<gw and 0<=ty<gh,(x,y,tx,ty,gw,gh)
              p=0x60+(ty*gw+tx)*2
              return struct.unpack(">H",green[p:p+2])[0] & 0x3ff

          report={
              "markers":markers,
              "origin_x":origin_x,
              "origin_y":origin_y,
              "cup_main":[cup_x,cup_y],
              "cup_green_raw_integer":[local_cup_x,local_cup_y],
              "maps_dimensions":[gw,gh],
              "cup_green_tile_ref":green_tile(local_cup_x,local_cup_y),
              "single_player_enter_bounds_main":[
                  origin_x+8,origin_x+0x70,
                  origin_y+8,origin_y+0x54
              ],
              "single_player_stay_bounds_green":[16,226,16,170],
          }
          open(sys.argv[4],"w").write(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x40AB1B --va 0x40AB97 --va 0x40C33C --va 0x40C3FE --va 0x40C40D \
            --radius 160 -o "$OUT/green-transition-xrefs.json"

          echo "=== course lookup ==="
          python - "$OUT/course-lookup.json" <<'PY'
          import json,sys
          for i in json.load(open(sys.argv[1]))["instructions"]:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

          echo "=== resource loader ==="
          python - "$OUT/resource-loader.json" <<'PY'
          import json,sys
          for i in json.load(open(sys.argv[1]))["instructions"]:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

          echo "=== green transition xrefs ==="
          python - "$OUT/green-transition-xrefs.json" <<'PY'
          import json,sys
          for x in json.load(open(sys.argv[1]))["xrefs"]:
              print("\nXREF",hex(x["xref_va"]),[hex(v) for v in x["targets"]])
              for i in x["instructions"]:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

          echo "=== green/map xrefs ==="
          python - "$OUT/green-map-xrefs.json" <<'PY'
          import json,sys
          for x in json.load(open(sys.argv[1]))["xrefs"]:
              print("\nXREF",hex(x["xref_va"]),[hex(v) for v in x["targets"]])
              for i in x["instructions"]:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

          set +e
          ./build/engine/sensigolf_classic_course_probe \
            "$ROOT/MAPS42.MAP" "$ROOT/MAPM42.SPT" \
            "$ROOT/MAPI01.RAW" "$ROOT/MAPI02.RAW" \
            > "$OUT/maps42-course-probe.json" 2> "$OUT/maps42-course-probe.err"
          echo $? > "$OUT/maps42-course-probe.exit"
          set -e
          cat "$OUT/maps42-course-probe.json" || true
          cat "$OUT/maps42-course-probe.err" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-green-map-recovery
          path: analysis/private/gate2-green-map-recovery/
          retention-days: 30
