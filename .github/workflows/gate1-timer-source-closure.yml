name: Gate 1 Timer Source Closure

on:
  push:
    paths:
      - ".github/workflows/gate1-timer-source-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace scheduler source
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate1-timer-source
          mkdir -p "$OUT"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x401C9C --va 0x401CE4 --va 0x401D53 --va 0x401C60 \
            --radius 80 -o "$OUT/xrefs.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x401E20 --end-va 0x402080 \
            -o "$OUT/timer-adjacent.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate1-timer-source/xrefs.json'))
          print('xref count',len(j['xrefs']))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== ADJACENT ===')
          j=json.load(open('analysis/private/gate1-timer-source/timer-adjacent.json'))
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-timer-source-closure
          path: analysis/private/gate1-timer-source/
          retention-days: 14
