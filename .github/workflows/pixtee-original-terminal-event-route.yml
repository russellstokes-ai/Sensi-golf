name: Pixtee Original Terminal Code35 Code50 X86 Route
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_terminal_event_route.py'
      - 'pixtee-godot/native/tests/original_terminal_event_route_probe.cpp'
      - 'engine/src/recovered_interactions.cpp'
      - 'engine/include/sensigolf/recovered_interactions.hpp'
      - '.github/workflows/pixtee-original-terminal-event-route.yml'
permissions:
  contents: read
jobs:
  original-terminal-event-route:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install unicorn==2.1.4
      - name: Fetch original SHA-verified source executable
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Compare authentic x86 terminal routes against recovered C++
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_prng.cpp engine/src/recovered_interactions.cpp \
            pixtee-godot/native/tests/original_terminal_event_route_probe.cpp \
            -o /tmp/pixtee-original-terminal-route
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_terminal_event_route.py \
            --exe "$EXE" --probe /tmp/pixtee-original-terminal-route \
            -o analysis/private/original-terminal-event-route-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-terminal-code35-code50-source-branch-evidence
          path: analysis/private/original-terminal-event-route-x86.json
          retention-days: 30
