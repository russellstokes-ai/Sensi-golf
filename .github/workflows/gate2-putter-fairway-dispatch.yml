name: Gate 2 Putter Fairway Dispatch Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-putter-fairway-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace club-12 and green-mode ownership
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-putter-fairway-dispatch
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A500 --end-va 0x40A680 \
            -o "$OUT/putter-dispatch.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41EE7A --va 0x40A581 --va 0x40A5A2 \
            --radius 96 -o "$OUT/green-mode-xrefs.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A7E0 --end-va 0x40AAA0 \
            -o "$OUT/putter-tail.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40AC80 --end-va 0x40AE00 \
            -o "$OUT/launch-dispatch.json"

          python - <<'PY'
          import json
          for fn in ('putter-dispatch','putter-tail','launch-dispatch'):
              print('\n===',fn,'===')
              j=json.load(open(f'analysis/private/gate2-putter-fairway-dispatch/{fn}.json'))
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== green-mode xrefs ===')
          j=json.load(open('analysis/private/gate2-putter-fairway-dispatch/green-mode-xrefs.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-putter-fairway-dispatch
          path: analysis/private/gate2-putter-fairway-dispatch/
          retention-days: 30
