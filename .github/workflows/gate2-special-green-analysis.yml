name: Gate 2 Special Green Rule Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-special-green-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Trace special green and near-hole branches
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT="analysis/private/gate2-special-green"
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A300 --end-va 0x40A800 \
            -o "$OUT/whole-tick-green-region.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40C480 --end-va 0x40C580 \
            -o "$OUT/helper-40c4c0.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x40A40B --va 0x40A460 --va 0x40A501 --va 0x40A581 \
            --va 0x40A5F7 --va 0x40A730 --va 0x40C4C0 \
            --radius 44 -o "$OUT/xrefs.json"

          python - <<'PY'
          import json
          for name in ('whole-tick-green-region','helper-40c4c0'):
              j=json.load(open(f'analysis/private/gate2-special-green/{name}.json'))
              print('\n===',name,'===')
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== XREFS ===')
          j=json.load(open('analysis/private/gate2-special-green/xrefs.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-special-green-analysis
          path: analysis/private/gate2-special-green/
          retention-days: 30
