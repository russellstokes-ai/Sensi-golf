name: Gate 1 Collision Helpers And Ranged PRNG

on:
  push:
    paths:
      - ".github/workflows/gate1-collision-helpers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace collision helpers and ranged PRNG
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT="analysis/private/gate1-collision-helpers"
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A1F0 --end-va 0x40A250 -o "$OUT/helper-40a1f0.json"
          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40AE06 --end-va 0x40AE7F -o "$OUT/helper-40ae06.json"
          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40AE7F --end-va 0x40AF3B -o "$OUT/helper-40ae7f.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x406FFA --va 0x40AE06 --va 0x40AE7F --va 0x40A1F0 \
            --radius 36 -o "$OUT/xrefs.json"

          python - <<'PY'
          import json,glob,os
          for p in sorted(glob.glob('analysis/private/gate1-collision-helpers/helper-*.json')):
              j=json.load(open(p))
              print('\n====',os.path.basename(p),'====')
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          j=json.load(open('analysis/private/gate1-collision-helpers/xrefs.json'))
          print('\n==== XREFS ====')
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-collision-helpers
          path: analysis/private/gate1-collision-helpers/
          retention-days: 14
