name: Gate 2 Terrain Variant Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-terrain-variant-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace ball terrain profile and variant fields
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-terrain-variant
          mkdir -p "$OUT"

          python tools/scan_struct_offsets.py "$WIN_EXE"             --offset 0x1e --offset 0x20 --offset 0x22 --offset 0x24             --radius 18 -o "$OUT/ball-tail-offsets.json"

          python tools/pe_disasm_range.py "$WIN_EXE"             --start-va 0x40B740 --end-va 0x40BA80             -o "$OUT/terrain-distance-region.json"

          python tools/pe_disasm_range.py "$WIN_EXE"             --start-va 0x40C2C0 --end-va 0x40C3A0             -o "$OUT/terrain-refresh-region.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-terrain-variant/ball-tail-offsets.json'))
          for h in j['hits']:
              if h['instruction']['op_str'].find('0x20')>=0 or h['instruction']['op_str'].find('0x22')>=0:
                  print('\nHIT',hex(h['address']),h['instruction'])
                  for x in h['context']:
                      print(f"{x['address']:08x} {x['mnemonic']:8} {x['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-terrain-variant-analysis
          path: analysis/private/gate2-terrain-variant/
          retention-days: 30
