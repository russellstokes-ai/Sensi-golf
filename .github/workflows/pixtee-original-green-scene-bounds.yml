name: Pixtee Original Green Scene Multi Object Bounds
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'engine/src/recovered_green_scene_bounds.cpp'
      - 'engine/include/sensigolf/recovered_green_scene_bounds.hpp'
      - 'tools/verify_original_green_scene_bounds.py'
      - 'pixtee-godot/native/tests/original_green_scene_bounds_probe.cpp'
      - '.github/workflows/pixtee-original-green-scene-bounds.yml'
permissions: {contents: read}
jobs:
  original-green-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Load SHA-verified source Windows v1.014 transiently
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Compile native rectangle source and strict boundary tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_green_scene_bounds.cpp \
            engine/tests/recovered_green_scene_bounds_tests.cpp \
            -o /tmp/pixtee-green-scene-tests
          /tmp/pixtee-green-scene-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_green_scene_bounds.cpp \
            pixtee-godot/native/tests/original_green_scene_bounds_probe.cpp \
            -o /tmp/pixtee-green-scene-probe
      - name: Compare authentic x86 all-object admission routes
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_green_scene_bounds.py \
            --exe "$EXE" --probe /tmp/pixtee-green-scene-probe \
            -o analysis/private/original-green-scene-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-green-scene-source
          path: analysis/private/original-green-scene-x86.json
          retention-days: 30
