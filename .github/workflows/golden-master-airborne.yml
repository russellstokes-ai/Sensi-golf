name: Golden Master Live Player

on:
  push:
    paths:
      - ".github/workflows/golden-master-airborne.yml"
      - "engine/**"
      - "tools/original_v1014_oracle.py"
      - "tools/compare_airborne_oracle.py"
      - "tools/pe_target_xrefs.py"
      - "tests/test_compare_airborne_oracle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-player-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch and ingest v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Build portable core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Locate reference executable
        shell: bash
        run: |
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          test -n "$WIN_EXE"
          echo "WIN_EXE=$WIN_EXE" >> "$GITHUB_ENV"
      - name: Exact live-player parity cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/private/golden-master-live
          run_case() {
            name="$1"; club="$2"; lie="$3"; power="$4"; accuracy="$5"; direction="$6"; ticks="$7"
            python tools/original_v1014_oracle.py "$WIN_EXE" \
              --club "$club" --lie "$lie" --power "$power" --accuracy "$accuracy" \
              --direction "$direction" --ticks "$ticks" \
              -o "analysis/private/golden-master-live/${name}-original.json"
            ./build/engine/sensigolf_recovered_probe \
              "$club" "$lie" "$power" "$accuracy" "$direction" "$ticks" \
              > "analysis/private/golden-master-live/${name}-recovered.json"
            python tools/compare_airborne_oracle.py \
              "analysis/private/golden-master-live/${name}-original.json" \
              "analysis/private/golden-master-live/${name}-recovered.json" \
              -o "analysis/private/golden-master-live/${name}-comparison.json"
            cat "analysis/private/golden-master-live/${name}-comparison.json"
          }
          run_case straight_1w 0 0 105 63 0 20
          run_case draw_mid 5 2 83 59 777 20
          run_case fade_high 11 0 60 67 3072 15
      - name: Unit/core tests
        run: |
          python -m unittest discover -s tests -v
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-golden-master-live
          path: analysis/private/golden-master-live/
          retention-days: 14
