name: Step 3 Pointer Chains
# rerun: pointer-table scan

on:
  push:
    paths:
      - ".github/workflows/step3-pointer-chains.yml"

permissions:
  contents: read

jobs:
  pointer-chains:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and ingest public PC archive
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Scan pointer chains
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3
          python tools/pe_pointer_chains.py "$WIN_EXE"             --targets-file reference/physics_debug_targets.txt             -o analysis/private/step3/physics-pointer-chains.json

      - name: Summarise
        run: |
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/step3/physics-pointer-chains.json'))
          total=0
          for t in j["targets"]:
              refs=t["references"]
              if refs:
                  print("\n==",t["text"],"string_off",t["string_file_offset"],
                        "rva",hex(t["string_rva"]),"va",hex(t["string_va"]),"==")
                  for r in refs:
                      total += 1
                      print("ref",r["encoding"],"at",r["file_offset"],"section",r["section"],
                            "value",hex(r["encoded_value"]))
                      print(" words",[(w["offset"],hex(w["u32"])) for w in r["words"]])
          print("\nTOTAL_POINTER_REFS",total)
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-step3-pointer-chains
          path: analysis/private/step3/physics-pointer-chains.json
          retention-days: 7
