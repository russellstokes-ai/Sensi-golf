name: Pixtee Original CPU Aiming Search Grid Oracle
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'pixtee-godot/native/src/original_cpu_search_grid.*'
      - 'pixtee-godot/native/tests/original_cpu_search_grid_probe.cpp'
      - 'tools/verify_original_cpu_scan_grid.py'
      - '.github/workflows/pixtee-original-cpu-scan-grid.yml'
permissions:
  contents: read
jobs:
  original_cpu_grid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ipixtee-godot/native/src \
            pixtee-godot/native/src/original_cpu_search_grid.cpp \
            pixtee-godot/native/tests/original_cpu_search_grid_probe.cpp \
            -o /tmp/original-cpu-grid
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_cpu_scan_grid.py \
            --exe "$EXE" --probe /tmp/original-cpu-grid \
            -o analysis/private/original-cpu-scan-grid-x86.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-cpu-aiming-table-and-search-scan-oracle
          path: analysis/private/original-cpu-scan-grid-x86.json
          retention-days: 30
