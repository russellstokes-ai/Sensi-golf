name: Pixtee Android Portrait
on:
  push:
    branches: ['feat/pixtee-native-portrait-framework']
    paths: ['pixtee-android/**', '.github/workflows/pixtee-android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixtee-android-development
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted runner already supplies Android SDK command-line tools.
      # setup-android@v3 currently tries to install retired SDK package
      # 'tools' and exits 1, unrelated to our game compilation.
      - name: Ensure Android SDK 35 is available
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate curated sponsor campaign placements
        run: python tools/validate_pixtee_sponsors.py
      - name: Test sponsor campaign validation
        run: python -m unittest discover -s tests -p 'test_validate_pixtee_sponsors.py' -v
      - name: Unit tests and APK
        run: gradle -p pixtee-android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify standalone Pixtee package
        run: |
          APK=pixtee-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -Z1 "$APK" | grep -E 'SensibleGolf|GOLFDOS|GOLF.EPF'; then
            echo "::error::Original game archive leaked into Pixtee"; exit 1
          fi
          mkdir -p out
          cp "$APK" out/Pixtee-Golf-0.1.1-sponsor-boards-portrait.apk
      # No APK is handed out from this development-only workflow.
      # The user requested only a polished, complete game release. A binary
      # existing after compilation does not mean a playable release exists.

  android-device-tests:
    name: Android emulator interactive gameplay smoke tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android touch and first-shot tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            gradle -p pixtee-android --no-daemon :app:connectedDebugAndroidTest
            RESULT=$?
            echo '=== Pixtee coordinate and navigation instrumentation logs ==='
            adb logcat -d -s PixteeSmoke:I PixteeTouch:I AndroidRuntime:E '*:S' | tail -n 250 || true
            exit $RESULT
      - name: Upload on-device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixtee-Android-interaction-reports
          path: |
            pixtee-android/app/build/reports/androidTests/connected/
            pixtee-android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
