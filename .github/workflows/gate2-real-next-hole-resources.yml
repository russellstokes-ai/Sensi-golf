name: Gate 2 Real Next Hole Resources

on:
  push:
    paths:
      - ".github/workflows/gate2-real-next-hole-resources.yml"
      - "tools/original_v1014_next_hole_resources.py"
      - "engine/include/sensigolf/classic_hole_plan.hpp"
      - "engine/src/classic_hole_plan.cpp"
      - "engine/tools/classic_hole_plan_probe.cpp"
      - "engine/tools/classic_course_probe.cpp"
      - "engine/src/classic_course_resources.cpp"
      - "engine/include/sensigolf/classic_course_resources.hpp"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Build portable core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure
      - name: Validate original first-to-second-hole resource handoff
        shell: bash
        run: |
          set -euo pipefail
          ROOT="analysis/private/step2/extracted/epf"
          OUT="analysis/private/gate2-real-next-hole-resources"
          mkdir -p "$OUT"

          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          python tools/original_v1014_next_hole_resources.py "$WIN_EXE" \
            -o "$OUT/original-resource-metadata.json"

          python - "$OUT/original-resource-metadata.json" "$OUT/selected.json" <<'PY'
          import json,sys
          src=json.load(open(sys.argv[1]))
          order=next(x["hole_ids"] for x in src["orders"] if x["slot"]==0)
          assert order and len(order)==18
          rows=[]
          for round_index in (0,1):
              rid=order[round_index]
              par=src["par_by_resource_id"][rid]
              assert 1 <= rid <= 99
              assert par > 0
              rows.append({"round_index":round_index,"resource_id":rid,"par":par})
          open(sys.argv[2],"w").write(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          PY

          for round_index in 0 1; do
            RID="$(python - "$OUT/selected.json" "$round_index" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          print(rows[int(sys.argv[2])]["resource_id"])
          PY
          )"
            PAR="$(python - "$OUT/selected.json" "$round_index" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          print(rows[int(sys.argv[2])]["par"])
          PY
          )"

            ./build/engine/sensigolf_classic_hole_plan_probe "$RID" \
              > "$OUT/plan-$round_index.json"

            python - "$OUT/plan-$round_index.json" "$RID" "$PAR" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          rid=int(sys.argv[2]); par=int(sys.argv[3])
          expected=f"{rid:02d}"
          assert j["resource_id"]==rid
          assert j["mapm_map"]==f"mapm{expected}.map"
          assert j["maps_map"]==f"maps{expected}.map"
          assert j["mapm_spt"]==f"mapm{expected}.spt"
          assert par > 0
          PY

            NN="$(printf '%02d' "$RID")"
            test -f "$ROOT/MAPM${NN}.MAP"
            test -f "$ROOT/MAPS${NN}.MAP"
            test -f "$ROOT/MAPM${NN}.SPT"

            ./build/engine/sensigolf_classic_course_probe \
              "$ROOT/MAPM${NN}.MAP" "$ROOT/MAPM${NN}.SPT" \
              "$ROOT/MAPI01.RAW" "$ROOT/MAPI02.RAW" \
              > "$OUT/course-$round_index.json"

            python - "$OUT/course-$round_index.json" "$RID" "$PAR" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["width"] > 0 and j["height"] > 0
          assert j["mapi_tiles"] == 640
          assert j["spt_records"] == 5
          print("validated resource",sys.argv[2],"par",sys.argv[3],j)
          PY
          done

          python - "$OUT/selected.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          assert rows[0]["resource_id"] != rows[1]["resource_id"]
          print("original next-hole resource transition:",rows[0],"->",rows[1])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-real-next-hole-resources
          path: analysis/private/gate2-real-next-hole-resources/
          retention-days: 30
