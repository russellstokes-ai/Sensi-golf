name: Gate 2 Hazard Recovery Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-hazard-recovery-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace post-hazard continuation
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-hazard-recovery
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE"             --start-va 0x40A7D0 --end-va 0x40AAB0             -o "$OUT/post-hazard-update.json"

          python tools/pe_disasm_range.py "$WIN_EXE"             --start-va 0x40AA80 --end-va 0x40AB80             -o "$OUT/recovery-helper-region.json"

          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x40AA84 --va 0x40B791 --va 0x40B9EC             --radius 52 -o "$OUT/recovery-helper-xrefs.json"

          python tools/scan_struct_offsets.py "$WIN_EXE"             --offset 0x52 --offset 0x56 --offset 0x58 --offset 0x5e             --offset 0x64 --offset 0x68 --offset 0x70 --offset 0x72 --offset 0x76             --radius 24 -o "$OUT/player-recovery-fields.json"

          python - <<'PY'
          import json
          for name in ('post-hazard-update','recovery-helper-region'):
              j=json.load(open(f'analysis/private/gate2-hazard-recovery/{name}.json'))
              print('\n===',name,'===')
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-hazard-recovery-analysis
          path: analysis/private/gate2-hazard-recovery/
          retention-days: 30
