name: Gate 2 Score Counter Initialization Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-score-counter-init-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace player score-counter initialization
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-score-counter-init
          mkdir -p "$OUT"

          python tools/scan_struct_offsets.py "$WIN_EXE" \
            --offset 0x52 --offset 0x56 --radius 18 \
            -o "$OUT/counter-offsets.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-score-counter-init/counter-offsets.json'))
          print('hits',len(j['hits']))
          for h in j['hits']:
              ins=h['instruction']
              print('\nHIT',hex(h['address']),ins['mnemonic'],ins['op_str'])
              for x in h['context']:
                  print(f"{x['address']:08x} {x['mnemonic']:8} {x['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-score-counter-init-analysis
          path: analysis/private/gate2-score-counter-init/
          retention-days: 30
