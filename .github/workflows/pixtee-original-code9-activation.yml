name: Pixtee Original Code9 Event Activation
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'tools/verify_original_code9_gate.py'
      - 'pixtee-godot/native/tests/original_code9_gate_probe.cpp'
      - 'engine/src/recovered_interactions.cpp'
      - '.github/workflows/pixtee-original-code9-activation.yml'
permissions:
  contents: read
jobs:
  original_code9_event_branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_prng.cpp engine/src/recovered_interactions.cpp \
            pixtee-godot/native/tests/original_code9_gate_probe.cpp \
            -o /tmp/pixtee-code9
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_code9_gate.py \
            --exe "$EXE" --probe /tmp/pixtee-code9 \
            -o analysis/private/original-code9-event-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-code9-source-event-classification
          path: analysis/private/original-code9-event-x86.json
          retention-days: 30
