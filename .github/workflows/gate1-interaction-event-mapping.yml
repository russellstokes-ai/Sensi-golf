name: Gate 1 Interaction Event Mapping

on:
  push:
    paths:
      - ".github/workflows/gate1-interaction-event-mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Map event dispatcher and sample resources
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate1-interaction-events
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x403E80 --end-va 0x404080 \
            -o "$OUT/event-dispatcher.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x403EF2 --radius 20 \
            -o "$OUT/event-callers.json"

          python - <<'PY' > "$OUT/raw-files.txt"
          import json
          inv=json.load(open('analysis/private/step2/reports/epf_inventory.json'))
          for n,e in enumerate(inv):
              if e['filename'].upper().endswith('.RAW'):
                  print(n,e['filename'],e['decompressed_size'])
          PY

          cat "$OUT/raw-files.txt"
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate1-interaction-events/event-dispatcher.json'))
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-interaction-event-mapping
          path: analysis/private/gate1-interaction-events/
          retention-days: 14
