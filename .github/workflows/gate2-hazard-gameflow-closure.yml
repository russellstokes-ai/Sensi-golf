name: Gate 2 Hazard Gameflow Closure

on:
  push:
    paths:
      - ".github/workflows/gate2-hazard-gameflow-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace post-hazard gameflow handoff
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-hazard-gameflow
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40CD80 --end-va 0x40CF80 \
            -o "$OUT/gameflow-40ce09.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x40CE09 --va 0x40A8D6 --va 0x40AA78 \
            --radius 96 -o "$OUT/callers.json"

          python tools/scan_struct_offsets.py "$WIN_EXE" \
            --offset 0x52 --offset 0x56 --offset 0x5a --offset 0x5c \
            --offset 0x60 --offset 0x70 --radius 36 \
            -o "$OUT/player-fields.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41F881 --va 0x41F883 --va 0x41D64B --va 0x40CF66 \
            --radius 88 -o "$OUT/terminal-state-xrefs.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40CF60 --end-va 0x40D180 \
            -o "$OUT/terminal-ui-tail.json"

          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate2-hazard-gameflow/gameflow-40ce09.json'))
          print('=== 0x40CE09 region ===')
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== callers ===')
          j=json.load(open('analysis/private/gate2-hazard-gameflow/callers.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('\n=== terminal state xrefs ===')
          j=json.load(open('analysis/private/gate2-hazard-gameflow/terminal-state-xrefs.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-hazard-gameflow-closure
          path: analysis/private/gate2-hazard-gameflow/
          retention-days: 30
