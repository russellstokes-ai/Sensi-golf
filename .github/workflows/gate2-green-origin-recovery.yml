name: Gate 2 Green Origin Recovery

on:
  push:
    paths:
      - ".github/workflows/gate2-green-origin-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Recover green origin writes and setup
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-green-origin-recovery
          mkdir -p "$OUT"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41E5EC --va 0x41E5EE --va 0x41E5F0 --va 0x41E5F2 \
            --radius 200 -o "$OUT/origin-xrefs.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x408B00 --end-va 0x409000 \
            -o "$OUT/course-load-region.json"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40C330 --end-va 0x40C4C0 \
            -o "$OUT/transition-region.json"

          python - <<'PY'
          import json
          print("=== ORIGIN XREFS ===")
          j=json.load(open('analysis/private/gate2-green-origin-recovery/origin-xrefs.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          for fn in ('course-load-region','transition-region'):
              print('\n===',fn,'===')
              j=json.load(open(f'analysis/private/gate2-green-origin-recovery/{fn}.json'))
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-green-origin-recovery
          path: analysis/private/gate2-green-origin-recovery/
          retention-days: 30
