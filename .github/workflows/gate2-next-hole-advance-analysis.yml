name: Gate 2 Next Hole Advance Analysis

on:
  push:
    paths:
      - ".github/workflows/gate2-next-hole-advance-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace current-hole increment routine and callers
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-next-hole-advance
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x409319 --end-va 0x409470 \
            -o "$OUT/increment-routine.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x409319 --va 0x40935A --va 0x4093FD --va 0x40945F \
            --radius 96 -o "$OUT/callers.json"

          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x42952B --va 0x41F883 --va 0x41F3A8 --va 0x41F3AC \
            --radius 44 -o "$OUT/state-xrefs.json"

          python - <<'PY'
          import json
          print('=== increment routine ===')
          j=json.load(open('analysis/private/gate2-next-hole-advance/increment-routine.json'))
          for i in j['instructions']:
              print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          print('=== callers ===')
          j=json.load(open('analysis/private/gate2-next-hole-advance/callers.json'))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-next-hole-advance-analysis
          path: analysis/private/gate2-next-hole-advance/
          retention-days: 30
