name: Pixtee Original Ten Slot Full Plain Script Tick
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'engine/src/recovered_animation_events.cpp'
      - 'engine/include/sensigolf/recovered_animation_events.hpp'
      - 'engine/tests/recovered_animation_events_tests.cpp'
      - 'tools/verify_original_full_plain_animation_tick.py'
      - 'pixtee-godot/native/tests/original_full_plain_animation_tick_probe.cpp'
      - '.github/workflows/pixtee-original-full-plain-animation-tick.yml'
permissions: {contents: read}
jobs:
  original-ten-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Ingest transient SHA-verified source executable
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Compile native mixed original timer/script source execution
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            engine/tests/recovered_animation_events_tests.cpp \
            -o /tmp/pixtee-native-event-mixed-tests
          /tmp/pixtee-native-event-mixed-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_animation_events.cpp \
            pixtee-godot/native/tests/original_full_plain_animation_tick_probe.cpp \
            -o /tmp/pixtee-native-event-mixed-probe
      - name: Compare original ten-slot positive script frames and timers against C++
        run: |
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_full_plain_animation_tick.py \
            --exe "$EXE" --probe /tmp/pixtee-native-event-mixed-probe \
            -o analysis/private/original-ten-slot-full-plain-animation-tick.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-full-plain-animation-tick
          path: analysis/private/original-ten-slot-full-plain-animation-tick.json
          retention-days: 30
