name: Gate 1 Course Lookup Constants

on:
  push:
    paths:
      - ".github/workflows/gate1-course-lookup-constants.yml"
      - "tools/extract_course_lookup_constants.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Extract lookup constants
        run: |
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/gate1-course-lookup
          python tools/extract_course_lookup_constants.py "$WIN_EXE" \
            -o analysis/private/gate1-course-lookup/constants.json
          cat analysis/private/gate1-course-lookup/constants.json
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-gate1-course-lookup-constants
          path: analysis/private/gate1-course-lookup/
          retention-days: 14
