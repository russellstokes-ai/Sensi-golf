name: Step 3 Player Launch Fields

on:
  push:
    paths:
      - ".github/workflows/step3-player-launch-fields.yml"

permissions:
  contents: read

jobs:
  player-launch-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest public PC archive
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Scan player launch-field accesses
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/step3
          python tools/scan_struct_offsets.py "$WIN_EXE" \
            --offset 0x12 --offset 0x20 --offset 0x28 \
            --offset 0x2a --offset 0x2e --offset 0x32 \
            --offset 0x5a --radius 16 \
            -o analysis/private/step3/player-launch-field-accesses.json
      - name: Print likely writes
        run: |
          python - <<'PY'
          import json,re
          j=json.load(open('analysis/private/step3/player-launch-field-accesses.json'))
          print('hit_count',len(j['hits']))
          for h in j['hits']:
              op=h['instruction']['op_str'].lower()
              # Print writes and all accesses in the 0x2a/2e/32 trajectory fields.
              ds={x['disp'] for x in h['operands']}
              if ds & {0x2a,0x2e,0x32} or re.match(r'^(mov|add|sub|imul|and|or|xor)\s',h['instruction']['mnemonic']+' '):
                  print('\nHIT',hex(h['address']),h['instruction']['mnemonic'],h['instruction']['op_str'],h['operands'])
                  for ins in h['context']:
                      mark='>>' if ins['address']==h['address'] else '  '
                      print(f"{mark} {ins['address']:08x} {ins['mnemonic']:8} {ins['op_str']}")
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-player-launch-fields
          path: analysis/private/step3/player-launch-field-accesses.json
          retention-days: 7
