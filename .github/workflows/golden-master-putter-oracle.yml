name: Golden Master Original Putter Oracle

on:
  push:
    paths:
      - ".github/workflows/golden-master-putter-oracle.yml"
      - "tools/original_v1014_putter_oracle.py"
      - "tools/original_v1014_oracle.py"
      - "tools/original_v1014_flat_oracle.py"
      - "tools/pe_target_xrefs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  putter-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn

      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Locate original executable
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          test -n "$WIN_EXE"
          echo "WIN_EXE=$WIN_EXE" >> "$GITHUB_ENV"

      - name: Capture original flat-green putts
        shell: bash
        run: |
          set -euo pipefail
          out="analysis/private/golden-master-putter"
          mkdir -p "$out"

          run_case() {
            name="$1"; power="$2"
            python tools/original_v1014_putter_oracle.py "$WIN_EXE" \
              --power "$power" --accuracy 63 --direction 0 --max-ticks 512 \
              -o "$out/${name}.json"

            python -c 'import json,sys; j=json.load(open(sys.argv[1])); print(j["surface_name"], "power", j["input"]["power"], "samples", len(j["samples"]), "V0", j["samples"][0]["vertical_force"], "H0", j["samples"][0]["horizontal_force"], "rest", j["events"]["rest"])' \
              "$out/${name}.json"
          }

          run_case putt_power_10 10
          run_case putt_power_30 30
          run_case putt_power_60 60

      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-original-putter-oracle
          path: analysis/private/golden-master-putter/
          retention-days: 14
