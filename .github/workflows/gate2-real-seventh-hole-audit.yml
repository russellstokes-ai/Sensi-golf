name: Gate 2 Real Seventh Hole Audit

on:
  push:
    paths:
      - ".github/workflows/gate2-real-seventh-hole-audit.yml"
      - "engine/tools/classic_real_hole_solver_probe.cpp"
      - "engine/include/sensigolf/classic_hole_session.hpp"
      - "engine/src/classic_hole_session.cpp"
      - "engine/include/sensigolf/classic_game_session.hpp"
      - "engine/src/classic_game_session.cpp"
      - "engine/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original-code emulator
        run: python -m pip install --disable-pip-version-check unicorn

      - name: Fetch verified v1.014
        run: |
          if ! curl -fLSs --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip; then
            curl -fLSs --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://archive.org/download/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
              -o /tmp/Sensible_Golf_PC.zip
          fi
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json

      - name: Build portable core and solver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure

      - name: Audit original second hole and its following resource
        shell: bash
        run: |
          set -euo pipefail
          ROOT="analysis/private/step2/extracted/epf"
          OUT="analysis/private/gate2-real-seventh-hole-audit"
          mkdir -p "$OUT"

          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          python tools/original_v1014_next_hole_resources.py "$WIN_EXE" \
            -o "$OUT/original-resource-metadata.json"

          python - "$OUT/original-resource-metadata.json" "$OUT/selected.json" <<'PY'
          import json,sys
          src=json.load(open(sys.argv[1]))
          order=next(x["hole_ids"] for x in src["orders"] if x["slot"]==0)
          rows=[]
          for round_index in (6,7):
              rid=order[round_index]
              rows.append({
                  "round_index":round_index,
                  "resource_id":rid,
                  "par":src["par_by_resource_id"][rid],
              })
          open(sys.argv[2],"w").write(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          PY

          RID="$(python -c 'import json; print(json.load(open("'"$OUT/selected.json"'"))[0]["resource_id"])')"
          PAR="$(python -c 'import json; print(json.load(open("'"$OUT/selected.json"'"))[0]["par"])')"
          NEXT_RID="$(python -c 'import json; print(json.load(open("'"$OUT/selected.json"'"))[1]["resource_id"])')"
          NEXT_PAR="$(python -c 'import json; print(json.load(open("'"$OUT/selected.json"'"))[1]["par"])')"
          NN="$(printf '%02d' "$RID")"
          NEXT_NN="$(printf '%02d' "$NEXT_RID")"

          ./build/engine/sensigolf_real_hole_solver_probe \
            "$RID" "$PAR" "$NEXT_RID" "$NEXT_PAR" \
            "$ROOT/MAPM${NN}.MAP" "$ROOT/MAPS${NN}.MAP" "$ROOT/MAPM${NN}.SPT" \
            "$ROOT/MAPI01.RAW" "$ROOT/MAPI02.RAW" \
            "$ROOT/MAPM${NEXT_NN}.MAP" "$ROOT/MAPS${NEXT_NN}.MAP" \
            "$ROOT/MAPM${NEXT_NN}.SPT" 0 \
            | tee "$OUT/result.json"

          python - "$OUT/result.json" "$RID" "$NEXT_RID" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["resource_id"]==int(sys.argv[2]),j
          assert j["next_resource_id"]==int(sys.argv[3]),j
          assert j["next_round_index"]==1,j  # isolated solver session starts from 0
          assert j["next_loaded"] is True,j
          assert j["next_tee_x"] >= 0 and j["next_tee_y"] >= 0,j
          assert j["strokes"] > 0,j
          assert j["shots"] and len(j["shots"])==j["strokes"],j
          print("seventh original-hole isolated proof passed:",json.dumps(j,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-real-seventh-hole-audit
          path: analysis/private/gate2-real-seventh-hole-audit/
          retention-days: 30
