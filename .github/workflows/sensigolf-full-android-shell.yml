name: Sensible Golf Full Original Android Shell - Build Verification

on:
  push:
    paths:
      - 'android-full/**'
      - 'tools/build_original_dosz.py'
      - 'tools/detect_sensible_main_menu.py'
      - 'tests/test_original_dosz.py'
      - '.github/workflows/sensigolf-full-android-shell.yml'
      - '.github/scripts/android_full_game_boot_test.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-full-game-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Test full original ZIP packager
        run: python -m unittest discover -s tests -p 'test_original_dosz.py' -v
      - name: Test no-crop aspect across phones / Fold / tablet / cutouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sg-viewport-classes
          javac -d /tmp/sg-viewport-classes \
            android-full/app/src/main/java/com/russellstokes/sensigolf/fullgame/ViewportPolicy.java \
            android-full/layout-tests/ViewportPolicyTest.java
          java -cp /tmp/sg-viewport-classes ViewportPolicyTest
      - name: Check out pinned GPL runtimes
        run: |
          set -euo pipefail
          mkdir -p android-full/vendor
          git clone --quiet https://github.com/Swordfish90/LibretroDroid.git android-full/vendor/LibretroDroid
          git -C android-full/vendor/LibretroDroid checkout -q 8835c3098514390a271e36983957f7bb5f40abf1
          git -C android-full/vendor/LibretroDroid submodule update --init --recursive --depth 1
          # This project uses the workflow-managed Gradle; no vendored wrapper binaries.
          rm -rf android-full/vendor/LibretroDroid/gradle/wrapper
          # Audio submodule ships unrelated sample wrapper jars, one fails trust validation.
          # We invoke only the pinned root Gradle; remove ALL unused vendor wrappers.
          find android-full/vendor/LibretroDroid -type f -name gradle-wrapper.jar -delete
          # Modern clang no longer provides accidental/transitive std::function.
          # Apply scoped, source-level header fixes in the pinned GPL checkout.
          sed -i '/#define LIBRETRODROID_RUMBLE_H/a #include <functional>' android-full/vendor/LibretroDroid/libretrodroid/src/main/cpp/rumble.h
          sed -i '/#define LIBRETRODROID_JAVAUTILS_H/a #include <functional>' android-full/vendor/LibretroDroid/libretrodroid/src/main/cpp/utils/javautils.h
          git clone --quiet https://github.com/libretro/dosbox-pure.git android-full/vendor/dosbox-pure
          git -C android-full/vendor/dosbox-pure checkout -q cdaea10ce8cac231bc341ca05d4c5e4e5fe0fbd5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile DOSBox Pure native Android library
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd android-full/vendor/dosbox-pure
          # Upstream's Android.mk wildcard returns paths prefixed by jni/.
          # NDK resolves LOCAL_SRC_FILES relative to jni/, so strip it once.
          sed -i 's@LOCAL_SRC_FILES    := $(SOURCES)@LOCAL_SRC_FILES    := $(patsubst $(LOCAL_PATH)/%,%,$(SOURCES))@' jni/Android.mk
          "$ANDROID_NDK_HOME/ndk-build" -C . APP_ABI="arm64-v8a x86_64" BUILD=RELEASE -j3
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a ../../app/src/main/jniLibs/x86_64
          for abi in arm64-v8a x86_64; do
            cp "libs/$abi/libretro.so" "../../app/src/main/jniLibs/$abi/libdosbox_pure_libretro_android.so"
          done
      - name: Prepare private original DOS game for compatibility boot test
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --connect-timeout 15 --max-time 120             'https://archive.org/download/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/SG-original-reference.zip
          python tools/build_original_dosz.py /tmp/SG-original-reference.zip
          unzip -Z1 android-full/app/src/main/assets/game/SensibleGolf.dosz             | grep -Fx GOLFDOS.EXE
          unzip -Z1 android-full/app/src/main/assets/game/SensibleGolf.dosz             | grep -Fx GOLF.EPF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile host Android app with native emulator core
        run: gradle -p android-full --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect integration artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=android-full/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep lib/arm64-v8a/libdosbox_pure_libretro_android.so
          unzip -l "$APK" | grep lib/x86_64/libdosbox_pure_libretro_android.so
          unzip -l "$APK" | grep lib/arm64-v8a/liblibretrodroid.so
          echo "PASS: frontend and native original DOS runtime compile."
      # GitHub's Linux runner exposes /dev/kvm but the runner account can lack
      # permissions. Without KVM the x86_64 emulator fails before Android boots.
      - name: Enable Android emulator KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::GitHub runner has no /dev/kvm; x86_64 Android boot cannot be validated here."
            exit 1
          fi
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "PASS: runner has KVM read/write permissions."
      - name: Install original-menu screenshot signature dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Boot original full game in Android x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/android_full_game_boot_test.sh
      - name: Save boot screenshot (never upload original game binary)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-full-game-android-poc-boot-evidence
          path: analysis/private/android-full-boot/
          retention-days: 14
      # No APK is uploaded: debug without the private original game copy
      # is not a playable full-game build and must never be presented as one.
