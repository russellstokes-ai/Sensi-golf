name: Pixtee Android Portrait
on:
  push:
    branches: ['feat/pixtee-native-portrait-framework']
    paths: ['pixtee-android/**', '.github/workflows/pixtee-android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK
        run: gradle -p pixtee-android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify standalone Pixtee package
        run: |
          APK=pixtee-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -Z1 "$APK" | grep -E 'SensibleGolf|GOLFDOS|GOLF.EPF'; then
            echo "::error::Original game archive leaked into Pixtee"; exit 1
          fi
          mkdir -p out
          cp "$APK" out/Pixtee-Golf-0.1.0-framework-portrait.apk
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixtee-Golf-0.1.0-framework-portrait
          path: out/Pixtee-Golf-0.1.0-framework-portrait.apk
          retention-days: 14
