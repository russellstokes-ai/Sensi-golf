name: Pixtee Original Terminal Terrain Rebound X86
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'engine/src/recovered_interactions.cpp'
      - 'engine/include/sensigolf/recovered_interactions.hpp'
      - 'tools/verify_original_terminal_rebound.py'
      - 'pixtee-godot/native/tests/original_terminal_rebound_probe.cpp'
      - '.github/workflows/pixtee-original-terminal-rebound.yml'
permissions:
  contents: read
jobs:
  original-terminal-rebound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Fetch original SHA-verified Windows executable
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - name: Verify original event rebound against recovered C++
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_prng.cpp engine/src/recovered_interactions.cpp \
            pixtee-godot/native/tests/original_terminal_rebound_probe.cpp \
            -o /tmp/pixtee-original-rebound
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_terminal_rebound.py \
            --exe "$EXE" --probe /tmp/pixtee-original-rebound \
            -o analysis/private/original-terminal-rebound-x86.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixtee-original-terminal-rebound-oracle
          path: analysis/private/original-terminal-rebound-x86.json
          retention-days: 30
