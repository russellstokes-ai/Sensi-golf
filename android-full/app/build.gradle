plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.russellstokes.sensigolf.fullgame'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.russellstokes.sensigolf'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.assets.srcDirs += 'src/main/assets'
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation project(':libretrodroid')
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    def game = file('src/main/assets/game/SensibleGolf.dosz')
    if (!game.isFile() || game.length() < 100_000L)
        throw new GradleException('REFUSING FULL-GAME RELEASE: legally cleared full original content is not packaged.')
}
