name: Gate 2 Counter Event Classification

on:
  push:
    paths:
      - ".github/workflows/gate2-counter-event-classification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Disassemble counter mutation sites
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT=analysis/private/gate2-counter-events
          mkdir -p "$OUT"

          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A2D0 --end-va 0x40A440 \
            -o "$OUT/preupdate-events.json"
          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40A700 --end-va 0x40A7A0 \
            -o "$OUT/landing-terminal.json"
          python tools/pe_disasm_range.py "$WIN_EXE" \
            --start-va 0x40BFC0 --end-va 0x40C0A0 \
            -o "$OUT/turn-adjust.json"

          python - <<'PY'
          import json
          for fn in ('preupdate-events','landing-terminal','turn-adjust'):
              print('\n===',fn,'===')
              j=json.load(open(f'analysis/private/gate2-counter-events/{fn}.json'))
              for i in j['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate2-counter-event-classification
          path: analysis/private/gate2-counter-events/
          retention-days: 30
