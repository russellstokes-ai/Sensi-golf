name: Routine Role Xrefs

on:
  push:
    paths:
      - ".github/workflows/routine-role-xrefs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest reference build
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Cross-reference candidate routines
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/routine-roles
          python tools/pe_va_xrefs.py "$WIN_EXE"             --va 0x40cb00 --va 0x40c84f --va 0x40ad1d             --radius 48             -o analysis/private/routine-roles/xrefs.json
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/routine-roles/xrefs.json'))
          for x in j['xrefs']:
              print('XREF',hex(x['xref_va']),'targets',','.join(hex(v) for v in x['targets']))
              for i in x['instructions']:
                  mark='>>' if i['address']==x['xref_va'] else '  '
                  print(f'{mark} {i["address"]:08x} {i["mnemonic"]:8} {i["op_str"]}')
              print()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-routine-role-xrefs
          path: analysis/private/routine-roles/xrefs.json
          retention-days: 14
