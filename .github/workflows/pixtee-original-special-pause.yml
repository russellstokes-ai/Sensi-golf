name: Pixtee Original Special Green Pause Timing
on:
  workflow_dispatch:
  push:
    branches: [feat/pixtee-godot-recovered-core]
    paths:
      - 'engine/src/recovered_putter_terminal.cpp'
      - 'engine/include/sensigolf/recovered_putter_terminal.hpp'
      - 'pixtee-godot/native/tests/original_special_pause_probe.cpp'
      - 'tools/verify_original_special_pause.py'
      - '.github/workflows/pixtee-original-special-pause.yml'
permissions:
  contents: read
jobs:
  special_timer_original_x86:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install unicorn==2.1.4
      - run: |
          curl -fL --retry 4 --retry-delay 3 \
            https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/sensi-ingest.json
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iengine/include \
            engine/src/recovered_putter_terminal.cpp \
            pixtee-godot/native/tests/original_special_pause_probe.cpp \
            -o /tmp/original-special-pause
          EXE="$(find analysis/private/step2/input -iname GOLFWIN.EXE -type f -print -quit)"
          python tools/verify_original_special_pause.py \
            --exe "$EXE" --probe /tmp/original-special-pause \
            -o analysis/private/original-special-pause-timing-x86.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-special-green-event-counter-x86-evidence
          path: analysis/private/original-special-pause-timing-x86.json
          retention-days: 30
