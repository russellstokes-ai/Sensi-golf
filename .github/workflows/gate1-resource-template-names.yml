name: Gate 1 Resource Template Names

on:
  push:
    paths:
      - ".github/workflows/gate1-resource-template-names.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2             'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip'             -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip             --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Decode loader filename templates
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          mkdir -p analysis/private/gate1-resource-names
          python - "$WIN_EXE" <<'PY' | tee analysis/private/gate1-resource-names/templates.txt
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from pe_target_xrefs import parse_pe,rva_to_file_offset
          data=Path(sys.argv[1]).read_bytes()
          image,_,sections=parse_pe(data)
          for va in [0x41eec7,0x41eed2,0x41eee9,0x41ef00,0x41ef0b,0x41ef16,0x41ef21,0x41ee7e]:
              off=rva_to_file_offset(va-image,sections)
              if off is None:
                  print(hex(va),'UNBACKED'); continue
              raw=data[off:off+64].split(b'\0',1)[0]
              print(hex(va),repr(raw.decode('ascii','replace')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-golf-gate1-resource-template-names
          path: analysis/private/gate1-resource-names/
          retention-days: 14
