name: Gate 1 Live Ball Xrefs

on:
  push:
    paths:
      - ".github/workflows/gate1-live-ball-xrefs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and ingest verified v1.014
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://cors.archive.org/cors/msdos_Sensible_Golf_1994/Sensible_Golf_1994.zip' \
            -o /tmp/Sensible_Golf_PC.zip
          python tools/ingest_pc_build.py /tmp/Sensible_Golf_PC.zip \
            --workspace analysis/private/step2 >/tmp/ingest.json
      - name: Trace authoritative live ball/player pointers
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find analysis/private/step2/input -type f -iname 'GOLFWIN.EXE' -print -quit)"
          OUT="analysis/private/gate1-live-ball-xrefs"
          mkdir -p "$OUT"
          python tools/pe_va_xrefs.py "$WIN_EXE" \
            --va 0x41F3AC --va 0x41F3A8 \
            --radius 36 -o "$OUT/live-ball-xrefs.json"
          python - <<'PY'
          import json
          j=json.load(open('analysis/private/gate1-live-ball-xrefs/live-ball-xrefs.json'))
          print('xref count',len(j['xrefs']))
          for x in j['xrefs']:
              print('\nXREF',hex(x['xref_va']),[hex(v) for v in x['targets']])
              for i in x['instructions']:
                  print(f"{i['address']:08x} {i['mnemonic']:8} {i['op_str']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensible-golf-gate1-live-ball-xrefs
          path: analysis/private/gate1-live-ball-xrefs/
          retention-days: 14
